<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coach Assiette</title>
<meta name="description" content="Coach nutrition : analyse de tes repas, coaching et idées de repas.">
<meta name="theme-color" content="#2C7868">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: phone-first app shell — sticky brand bar, one scrolling column (max 560px), fixed bottom tab bar */
/* Colour: four selectable "ambiances" (data-amb on <html>), each with a light and a dark variant. Menthe et miel is the default. */
:root{
  --bg:#F3F8F6; --surface:#FFFFFF; --surface-2:#E2EFEA; --ink:#24403A; --muted:#587069; --line:#CFE1DA; --accent:#2C7868; --accent-ink:#FFFFFF; --accent-soft:#D5ECE5; --sage:#256A55; --sage-soft:#D9EFE6; --ochre:#7A5A12; --ochre-soft:#FBEFD5; --danger:#A23D31; --danger-soft:#F9E3DF; --warm:#8A5A0C; --warm-soft:#FCF0D2; --warm-bar:#E0A43A; color-scheme:light;
  --font-display:"Nunito", "Noto Sans Arabic", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-body:"Nunito", "Noto Sans Arabic", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:18px; --r-s:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0F1715; --surface:#16211E; --surface-2:#1F2E2A; --ink:#E3EFEB; --muted:#9DB3AC; --line:#2A3B37; --accent:#6FC7B2; --accent-ink:#08201B; --accent-soft:#1D3A33; --sage:#7FCDB5; --sage-soft:#1C352E; --ochre:#E8B85A; --ochre-soft:#372B12; --danger:#F08A7C; --danger-soft:#3B1E1A; --warm:#F0C46A; --warm-soft:#3A2E14; --warm-bar:#E0A43A; color-scheme:dark }}
:root[data-theme="dark"]{ --bg:#0F1715; --surface:#16211E; --surface-2:#1F2E2A; --ink:#E3EFEB; --muted:#9DB3AC; --line:#2A3B37; --accent:#6FC7B2; --accent-ink:#08201B; --accent-soft:#1D3A33; --sage:#7FCDB5; --sage-soft:#1C352E; --ochre:#E8B85A; --ochre-soft:#372B12; --danger:#F08A7C; --danger-soft:#3B1E1A; --warm:#F0C46A; --warm-soft:#3A2E14; --warm-bar:#E0A43A; color-scheme:dark }
:root[data-amb="sauge"]{ --bg:#F5F8F2; --surface:#FFFFFF; --surface-2:#E9F0E6; --ink:#2D3B33; --muted:#5F6E64; --line:#D5E0D1; --accent:#48775A; --accent-ink:#FFFFFF; --accent-soft:#DCEBDD; --sage:#346B44; --sage-soft:#DDEEDF; --ochre:#7A5A12; --ochre-soft:#FBEFD5; --danger:#A23D31; --danger-soft:#F9E3DF; --warm:#8A4A1F; --warm-soft:#FCE6D4; --warm-bar:#E8955E; }
@media (prefers-color-scheme: dark){ :root[data-amb="sauge"]:not([data-theme="light"]){ --bg:#121812; --surface:#1A221B; --surface-2:#243026; --ink:#E5EDE5; --muted:#A0AFA2; --line:#2E3B30; --accent:#8CC39A; --accent-ink:#0E2014; --accent-soft:#213826; --sage:#8CC39A; --sage-soft:#1E3324; --ochre:#E6B65A; --ochre-soft:#382C14; --danger:#F08A7C; --danger-soft:#3B1E1A; --warm:#F2B48A; --warm-soft:#3D271A; --warm-bar:#E8955E; color-scheme:dark }}
:root[data-amb="sauge"][data-theme="dark"]{ --bg:#121812; --surface:#1A221B; --surface-2:#243026; --ink:#E5EDE5; --muted:#A0AFA2; --line:#2E3B30; --accent:#8CC39A; --accent-ink:#0E2014; --accent-soft:#213826; --sage:#8CC39A; --sage-soft:#1E3324; --ochre:#E6B65A; --ochre-soft:#382C14; --danger:#F08A7C; --danger-soft:#3B1E1A; --warm:#F2B48A; --warm-soft:#3D271A; --warm-bar:#E8955E; color-scheme:dark }
:root[data-amb="ciel"]{ --bg:#F4F7FA; --surface:#FFFFFF; --surface-2:#E6EDF4; --ink:#26364A; --muted:#5B6B7C; --line:#D3DDE8; --accent:#3F6F99; --accent-ink:#FFFFFF; --accent-soft:#DCE8F3; --sage:#276A4F; --sage-soft:#DCEFE5; --ochre:#7A5A12; --ochre-soft:#FBEFD5; --danger:#A23D31; --danger-soft:#F9E3DF; --warm:#7A5A1E; --warm-soft:#F8EBD3; --warm-bar:#D9A85A; }
@media (prefers-color-scheme: dark){ :root[data-amb="ciel"]:not([data-theme="light"]){ --bg:#0F151C; --surface:#161F29; --surface-2:#1F2B38; --ink:#E3EAF2; --muted:#9AABBD; --line:#2A3847; --accent:#8DB8E0; --accent-ink:#0B1D2E; --accent-soft:#1D3147; --sage:#7CCBA6; --sage-soft:#1B3328; --ochre:#E6B65A; --ochre-soft:#382C14; --danger:#F08A7C; --danger-soft:#3B1E1A; --warm:#EBCB8E; --warm-soft:#362B17; --warm-bar:#D9A85A; color-scheme:dark }}
:root[data-amb="ciel"][data-theme="dark"]{ --bg:#0F151C; --surface:#161F29; --surface-2:#1F2B38; --ink:#E3EAF2; --muted:#9AABBD; --line:#2A3847; --accent:#8DB8E0; --accent-ink:#0B1D2E; --accent-soft:#1D3147; --sage:#7CCBA6; --sage-soft:#1B3328; --ochre:#E6B65A; --ochre-soft:#382C14; --danger:#F08A7C; --danger-soft:#3B1E1A; --warm:#EBCB8E; --warm-soft:#362B17; --warm-bar:#D9A85A; color-scheme:dark }
:root[data-amb="lavande"]{ --bg:#F7F6FB; --surface:#FFFFFF; --surface-2:#ECEAF5; --ink:#34324A; --muted:#66647C; --line:#DDDAEA; --accent:#6A5FA8; --accent-ink:#FFFFFF; --accent-soft:#E6E2F4; --sage:#33694F; --sage-soft:#DDEFE4; --ochre:#7A5A12; --ochre-soft:#FBEFD5; --danger:#A23D31; --danger-soft:#F9E3DF; --warm:#8E4E2A; --warm-soft:#FCE7DA; --warm-bar:#EE9F75; }
@media (prefers-color-scheme: dark){ :root[data-amb="lavande"]:not([data-theme="light"]){ --bg:#13121B; --surface:#1B1A26; --surface-2:#252433; --ink:#E9E7F3; --muted:#A7A4BC; --line:#32303F; --accent:#B2A8EC; --accent-ink:#1A1533; --accent-soft:#2B2747; --sage:#85C9A6; --sage-soft:#1C3327; --ochre:#E6B65A; --ochre-soft:#382C14; --danger:#F08A7C; --danger-soft:#3B1E1A; --warm:#F4BE9C; --warm-soft:#3D2619; --warm-bar:#EE9F75; color-scheme:dark }}
:root[data-amb="lavande"][data-theme="dark"]{ --bg:#13121B; --surface:#1B1A26; --surface-2:#252433; --ink:#E9E7F3; --muted:#A7A4BC; --line:#32303F; --accent:#B2A8EC; --accent-ink:#1A1533; --accent-soft:#2B2747; --sage:#85C9A6; --sage-soft:#1C3327; --ochre:#E6B65A; --ochre-soft:#382C14; --danger:#F08A7C; --danger-soft:#3B1E1A; --warm:#F4BE9C; --warm-soft:#3D2619; --warm-bar:#EE9F75; color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.shell{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:.1px;display:flex;align-items:center;gap:8px}
.brand-dot{width:22px;height:22px;border-radius:50%;background:var(--accent);display:inline-grid;place-items:center}
.brand-dot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--bg)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1.15;letter-spacing:-.2px}
h2{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.25}
h3{font-size:16px;font-weight:700}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:0 1px 2px rgba(30,50,40,.04)}
.card.flat{background:var(--surface-2);border-color:transparent}
.section{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.btn{appearance:none;border:1px solid transparent;border-radius:14px;min-height:48px;padding:10px 16px;font:600 16px/1.2 var(--font-body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface-2);color:var(--ink);text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.outline{background:var(--surface);border-color:var(--line)}
.btn.ghost{background:transparent;min-height:40px;padding:8px 10px;color:var(--muted)}
.btn.big{min-height:58px;font-size:18px;font-weight:700}
.btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
label.btn{position:relative}
label.btn:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.pick{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:0;cursor:pointer;font-size:0;z-index:1}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.opt-pick:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.link{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:500 15px/1.2 var(--font-body);cursor:pointer;min-height:40px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-2);padding:4px;border-radius:14px}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink);border-radius:10px;min-height:40px;font:600 14px/1.2 var(--font-body);cursor:pointer;padding:6px 8px}
.seg button.on{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12);color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:14px;font-weight:700;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=password],select,textarea{width:100%;min-width:0;padding:12px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);color:var(--ink);font:16px/1.3 var(--font-body)}
textarea{min-height:88px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.check{display:flex;gap:12px;align-items:flex-start;font-size:15px;cursor:pointer}
.check input{width:22px;height:22px;flex:0 0 22px;margin:1px 0 0;accent-color:var(--accent)}
.opt-pick{appearance:none;text-align:start;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:14px;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:4px;width:100%}
.opt-pick.on{border-color:var(--accent);background:var(--accent-soft)}
.opt-pick strong{font-size:16px}
.note{border-radius:var(--r-s);padding:12px 14px;font-size:15px;display:flex;gap:10px;align-items:flex-start}
.note.info{background:var(--surface-2)}
.note.warn{background:var(--ochre-soft)}
.note.danger{background:var(--danger-soft)}
.note .ic{flex:0 0 20px;height:20px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px}
.note.info .ic{background:var(--line);color:var(--ink)}
.note.warn .ic{background:var(--ochre);color:var(--surface)}
.note.danger .ic{background:var(--danger);color:var(--surface)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.emo{background:var(--warm-soft);color:var(--warm)}
.badge.ai{background:var(--surface-2);color:var(--muted);letter-spacing:.02em}
.badge.eq{background:var(--sage-soft);color:var(--sage)}
.badge.co{background:var(--ochre-soft);color:var(--ochre)}
.badge.pl{background:var(--warm-soft);color:var(--warm)}
.progress{font-size:13px;color:var(--muted);font-weight:600}
.dots{display:flex;gap:6px}
.dots i{width:24px;height:4px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--accent)}
/* Today */
.budget{display:flex;flex-direction:column;gap:12px}
.budget-big{font-family:var(--font-display);font-weight:800;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.budget-big small{font-family:var(--font-body);font-size:16px;color:var(--muted);margin-inline-start:6px}
.bar{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sage);border-radius:6px}
.bar.over>i{background:var(--warm-bar)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv b{font-size:17px;font-variant-numeric:tabular-nums}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.macro{background:var(--surface-2);border-radius:var(--r-s);padding:10px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.macro b{font-size:17px;font-variant-numeric:tabular-nums}
.macro span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.macro.sugar{background:var(--warm-soft)}
.macro.sugar b{color:var(--warm)}
.cta{display:grid;grid-template-columns:1fr;gap:10px}
.list{display:flex;flex-direction:column}
.item{border-top:1px solid var(--line);padding-block:12px;display:flex;flex-direction:column;gap:8px}
.item:first-child{border-top:0;padding-top:0}
.item:last-child{padding-bottom:0}
.item-head{appearance:none;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:start;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;width:100%}
.item-time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px;min-width:40px}
.item-name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item-kcal{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.coach{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.coach p{font-size:17px}
.coach.strict{border-inline-start:0}
.food{display:grid;grid-template-columns:1fr 92px auto;gap:10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.food:first-child{border-top:0}
.food .nm{min-width:0;overflow-wrap:anywhere}
.food input{padding:8px;text-align:end}
.food .kc{font-variant-numeric:tabular-nums;min-width:62px;text-align:end;font-weight:600}
.x{appearance:none;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:4px 6px;border-radius:8px}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.total .range{font-family:var(--font-display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums}
.photo-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);border-radius:var(--r);background:var(--surface);min-height:150px;padding:16px;cursor:pointer;text-align:center;color:var(--muted)}
.photo-drop{position:relative}
.photo-drop input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;font-size:0;z-index:1}
.photo-drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.photo-drop .plus{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:26px;font-weight:600}
.preview{width:100%;max-height:260px;object-fit:cover;border-radius:var(--r);display:block}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;min-height:46px;font:700 17px/1 var(--font-body);cursor:pointer}
.scale button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ends{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}
.ends span{max-width:48%}
.ends span:last-child{text-align:end}
.scale.s6{grid-template-columns:repeat(6,1fr)}
.opt{display:flex;flex-direction:column;gap:12px}
.opt ul,.opt ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.opt-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.opt-meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--accent);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}}
.loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:28px;text-align:center}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 10px;font:600 11px/1.1 var(--font-body);cursor:pointer;min-height:58px}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.tab.add .ring{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-4px}
.tab.add .ring svg{width:20px;height:20px;stroke-width:2.4}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(10,15,11,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.chart{width:100%;height:auto;display:block}
.chart .b-ok{fill:var(--sage)} .chart .b-over{fill:var(--warm-bar)} .chart .b-sugar{fill:var(--warm-bar)}
.chart .ref{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3}
.chart .lbl{fill:var(--muted);font:600 10px var(--font-body)}
.chart .val{fill:var(--ink);font:600 10px var(--font-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .line{stroke:var(--accent);stroke-width:2.5;fill:none}
.chart .pt{fill:var(--accent)}

in_t:'Installer l’application', in_d:'Ajoute Coach Assiette sur ton écran d’accueil : elle s’ouvrira comme une vraie application, en plein écran.', in_btn:'Installer l’application', in_first_ios:'Sur iPhone, installe-la avant de t’inscrire : tu ouvriras ensuite l’application depuis son icône.', in_done:'C’est installé ! Retrouve Coach Assiette sur ton écran d’accueil.', in_ok:'L’application est installée : tu l’utilises depuis son icône.', in_sum_ok:'Installée', in_sum_no:'Pas encore installée', in_ios_t:'Sur iPhone, en 3 gestes', in_ios_1:'Touche le bouton Partager (un carré avec une flèche vers le haut) : en bas de Safari ou dans son menu « ⋯ », en haut à droite dans Chrome.', in_ios_2:'Fais défiler et choisis « Sur l’écran d’accueil ». Tu ne le vois pas ? Ouvre d’abord ce lien dans Safari.', in_ios_3:'Touche « Ajouter » : l’icône Coach Assiette apparaît sur ton écran d’accueil.', in_ios_after:'Ouvre ensuite l’application depuis cette icône (connecte-toi si elle te le demande). Sur iPhone, les rappels de repas ne marchent que depuis l’application installée.', in_and_t:'Sur Android, en 3 gestes', in_and_1:'Ouvre le menu du navigateur : ⋮ en haut à droite dans Chrome, ≡ en bas dans Samsung Internet.', in_and_2:'Choisis « Installer l’application » ou « Ajouter à l’écran d’accueil ». Tu ne le vois pas ? Choisis d’abord « Ouvrir dans Chrome ».', in_and_3:'Confirme : l’icône Coach Assiette apparaît sur ton écran d’accueil.', in_app_t:'Ouvre d’abord ce lien dans ton navigateur', in_app_d:'Tu es dans le navigateur d’une autre application (Instagram, Facebook…), qui ne permet pas l’installation. Touche le menu ⋯ ou ⋮, choisis « Ouvrir dans le navigateur » (ou « Ouvrir dans Safari / Chrome »), puis touche à nouveau « Installer l’application ».', in_pc:'Sur ordinateur, dans Chrome ou Edge : clique sur l’icône d’installation à droite de la barre d’adresse, ou dans le menu ⋮ sur « Installer Coach Assiette ». Sur téléphone, ouvre le même lien et touche « Installer l’application ».', in_did:'C’est fait',
vac_t:'Mode vacances', vac_d:'En vacances, le rythme change : on bouge différemment, on mange plus souvent dehors ou en famille, on boit parfois plus. Active ce mode pour que ton coach adapte ses conseils, sans pression sur le poids.', vac_from:'Du', vac_to:'Au (facultatif)', vac_move:'Pendant ces vacances, je bouge', vac_less:'Moins', vac_same:'Autant', vac_more:'Plus', vac_move_hint:'« Moins » baisse un peu tes besoins estimés, « Plus » les augmente un peu.', vac_pause_weigh:'Mettre la pesée du matin en pause pendant les vacances', vac_on:'Activer le mode vacances', vac_off:'Terminer mes vacances', vac_on_toast:'Mode vacances activé. Bonnes vacances !', vac_off_toast:'Mode vacances terminé.', vac_sum_on:'Activé jusqu’au {d}', vac_sum_open:'Activé', vac_today_d:'Profite ! Ton coach adapte ses conseils : pas de pression sur le poids, l’équilibre se regarde sur la semaine.', vac_until:'Jusqu’au {d}', vac_back_t:'Bon retour !', vac_back_d:'Tes vacances sont terminées : ton coaching reprend son rythme habituel. Si la balance a un peu monté, pas d’inquiétude : c’est souvent en partie de l’eau, qui repart dans les semaines qui suivent.', vac_weigh_note:'En vacances, le poids monte souvent un peu (repas plus salés, alcool, rythme différent). C’est en partie de l’eau, qui repart souvent dans les semaines qui suivent le retour.', vac_badge:'En vacances', vac_coach:'En vacances du {a} au {b}', vac_coach_open:'En vacances depuis le {a}', vac_bad_dates:'La date de fin doit être après la date de début.',

au_forgot_btn:'Mot de passe oublié ?', fp_t:'Mot de passe oublié', fp_d:'Indique l’adresse e-mail de ton compte : tu vas recevoir un lien pour choisir un nouveau mot de passe.', fp_go:'Recevoir le lien', fp_sent:'C’est envoyé ! Si un compte existe avec cette adresse, un e-mail arrive dans quelques minutes (pense à regarder dans les spams). Ouvre le lien sur ce téléphone.', fp_back:'Retour à la connexion', fp_wait:'Trop de demandes d’affilée. Patiente quelques minutes, puis réessaie.', fp_expired:'Ce lien a expiré ou a déjà servi. Demande un nouveau lien ci-dessous.', fp_help:'Pas d’e-mail reçu ? Ton coach peut aussi réinitialiser ton mot de passe.', rp_t:'Nouveau mot de passe', rp_d:'Choisis un nouveau mot de passe pour le compte {e}.', rp_new:'Nouveau mot de passe', rp_new2:'Confirme le nouveau mot de passe', rp_go:'Enregistrer mon nouveau mot de passe', rp_mismatch:'Les deux mots de passe ne sont pas identiques.', rp_same:'Choisis un mot de passe différent de l’ancien.', rp_done:'Mot de passe modifié.', m_ulcere:'Ulcère ou gastrite', m_reflux:'Reflux ou brûlures d’estomac', m_digestion_lente:'Digestion lente, ballonnements', m_sii:'Côlon irritable (SII)', hn_dig:'Troubles digestifs : après chaque repas, ton coach te signale les aliments souvent mal tolérés et t’aide à alléger le soir, pour mieux digérer et mieux dormir. Chacun réagit différemment : observe ce qui te convient. L’app ne remplace pas ton médecin ; en cas de douleur forte, de vomissements ou de sang, consulte rapidement.', vw_t:'Lisibilité', vw_d:'Pour lire plus facilement : agrandis le texte, renforce le contraste ou choisis un fond clair ou sombre. Le réglage est enregistré sur ce téléphone.', vw_size:'Taille du texte', vw_s1:'Normale', vw_s2:'Grande', vw_s3:'Très grande', vw_contrast:'Contraste renforcé', vw_tip:'Astuce : le lecteur d’écran de ton téléphone (TalkBack sur Android, VoiceOver sur iPhone) peut aussi lire l’application à voix haute.',
rights:'Tous droits réservés', terms_link:'Conditions d’utilisation', au_terms:'J’accepte les conditions d’utilisation', au_terms_read:'Lire', au_need_terms:'Coche la case pour accepter les conditions d’utilisation.', tm_t:'Conditions d’utilisation', tm_date:'Version du 14 octobre 2026', tm_intro:'Coach Assiette est une application d’accompagnement nutritionnel créée par {o}. En créant un compte, tu acceptes les conditions ci-dessous.', tm_h1:'1. Ce que fait l’application', tm_p1:'Elle estime les calories, les macronutriments et les sucres de tes repas à partir de photos ou de descriptions, et te donne des conseils de coaching. Ces estimations sont indicatives : l’application ne remplace pas un médecin, un diététicien ni un allergologue.', tm_h2:'2. Ton compte', tm_p2:'Ton compte est personnel : ne le partage pas et garde ton mot de passe pour toi. L’application est réservée aux personnes de 18 ans et plus.', tm_h3:'3. Propriété intellectuelle', tm_p3:'L’application (son code, son design, ses textes, ses questionnaires, son nom « Coach Assiette » et son logo) appartient à {o}. Tous droits réservés. Il est interdit de la copier, de la reproduire, de la modifier, de la revendre, de la mettre à disposition d’autres personnes ou de l’exploiter commercialement, en tout ou en partie, sans son accord écrit (articles L.122-4 et L.335-2 du Code de la propriété intellectuelle).', tm_h4:'4. Tes données', tm_p4:'Tes données sont enregistrées sur des serveurs en Europe et ne sont jamais revendues. Les photos sont envoyées à un service d’intelligence artificielle uniquement pour être analysées : l’application ne les conserve pas. Ton coach ne voit tes résultats que si tu l’acceptes, et tu peux retirer cet accord à tout moment. Tu peux exporter ou supprimer toutes tes données, et ton compte, depuis les Réglages.', tm_h5:'5. Accès offert ou abonnement', tm_p5:'Selon ce que décide ton coach, ton accès est offert ou soumis à un abonnement mensuel. L’abonnement se paie par carte bancaire ou prélèvement SEPA via Stripe ; ton coach ne voit jamais tes coordonnées bancaires. Tu peux le résilier à tout moment depuis les Réglages : il reste actif jusqu’à la fin de la période payée. Si un paiement n’aboutit pas, l’analyse des photos et les conseils de l’IA sont mis en pause ; tes données restent accessibles.', tm_h6:'6. Évolutions', tm_p6:'L’application peut évoluer, être modifiée ou arrêtée. Si ces conditions changent de façon importante, elles te seront présentées à nouveau.', tm_h7:'7. Droit applicable', tm_p7:'Ces conditions sont soumises au droit français.', tm_accept:'J’accepte', tm_gate:'Avant de continuer, merci de lire et d’accepter les conditions d’utilisation.', s_pay:'Mon abonnement', pay_t:'Abonnement', pay_d:'Pour analyser tes repas en photo et recevoir les conseils de l’IA, un abonnement mensuel est nécessaire. Tu peux le résilier quand tu veux.', pay_price:'{p} par mois', pay_go:'M’abonner', pay_manage:'Gérer mon abonnement (paiement, résiliation)', pay_secure:'Paiement sécurisé par Stripe, par carte bancaire ou prélèvement SEPA. Ton coach ne voit jamais tes coordonnées bancaires.', pay_meanwhile:'En attendant, tu peux continuer à noter tes repas à la main.', pay_ai_off:'L’analyse par IA est en pause : ton abonnement n’est pas actif. Tu peux noter ton repas à la main, ou t’abonner dans Réglages > Mon abonnement.', pay_banner_t:'Analyse des photos en pause', pay_banner_d:'Ton abonnement n’est pas actif. Tu peux continuer à noter tes repas à la main.', pay_see:'Voir l’abonnement', pay_late_banner:'Ton dernier paiement n’est pas passé. Mets à jour ton moyen de paiement pour garder l’analyse des photos.', pay_s_free:'Offert', pay_s_active:'Actif', pay_s_late:'Paiement à régulariser', pay_s_none:'À activer', pay_s_proc:'En cours de validation', pay_free_d:'Ton coach t’offre l’accès à l’application : tu n’as rien à payer.', pay_active_d:'Abonnement actif. Prochain paiement le {d}.', pay_active_end:'Abonnement résilié : il reste actif jusqu’au {d}.', pay_late_d:'Ton dernier paiement n’est pas passé. Mets à jour ton moyen de paiement dans les prochains jours pour garder l’analyse des photos.', pay_late_off:'Ton paiement n’est pas passé : l’analyse des photos est en pause. Mets à jour ton moyen de paiement pour la réactiver.', pay_proc:'Ton paiement est en cours de validation (un prélèvement SEPA peut prendre quelques jours). Tu peux déjà utiliser l’application.', pay_thanks:'Merci ! Ton abonnement est actif.', pay_pending:'Paiement reçu : il est en cours de validation.', pay_cancelled:'Paiement annulé : rien n’a été prélevé.', pay_already:'Tu as déjà un abonnement actif.', pay_not_ready:'Le paiement n’est pas encore disponible. Réessaie plus tard ou parles-en à ton coach.', pay_price_loading:'Chargement du prix…', ct_follow:'Suivi', ct_bill:'Abonnements', bill_t:'Abonnements payants', bill_off_d:'Désactivés : tout le monde utilise l’application gratuitement. Tu peux déjà choisir ci-dessous qui sera offert et qui paiera.', bill_on_d:'Activés : les personnes « Payant » ont besoin d’un abonnement à jour pour l’analyse des photos et les conseils de l’IA.', bill_turn_on:'Activer les abonnements', bill_turn_off:'Désactiver les abonnements', bill_need_stripe:'À activer seulement quand ton compte Stripe est relié à l’application.', bill_confirm_on:'Activer les abonnements ? Les personnes « Payant » sans abonnement ne pourront plus analyser leurs photos (elles pourront toujours noter leurs repas à la main).', bill_confirm_yes:'Oui, activer', bill_default_t:'Nouveaux comptes', bill_default_d:'Règle appliquée à toute personne que tu n’as pas réglée une par une.', bill_free:'Offert', bill_paid:'Payant', bill_add_t:'Régler une personne par e-mail', bill_add_d:'Marche aussi avant qu’elle crée son compte, par exemple pour offrir l’accès à ta famille.', bill_set_free:'Offrir l’accès', bill_set_paid:'Rendre payant', bill_list_t:'Tous les comptes', bill_sum:'{a} abonné(s) à jour · {f} accès offert(s) · {n} compte(s)', bill_me:'Toi (coach)', bill_invited:'Pas encore inscrit', bill_st_active:'Abonné', bill_st_late:'Paiement en retard', bill_st_none:'Pas abonné', bill_st_free:'Offert', bill_by_default:'Suit la règle « Nouveaux comptes »', bill_next:'Prochain paiement le {d}', bill_ends:'Se termine le {d}', bill_saved:'Enregistré.', bill_err:'Impossible de charger les abonnements. Vérifie que la dernière version de la base de données est installée.', bill_bad_email:'Adresse e-mail invalide.', bill_help:'L’argent des abonnements est versé par Stripe directement sur ton compte bancaire. Les personnes avec un accès offert ne voient jamais rien concernant le paiement.',
s_rem:'Rappels de repas', rem_d:'Une notification si une case repas est encore vide à l’heure choisie. Un seul rappel par repas, jamais si le repas est déjà noté ou sauté.', rem_times_hint:'Efface une heure pour ne pas être rappelé pour ce repas.', rem_water:'Rappel « Pense à boire » à 11 h et 16 h, seulement si ta gourde est peu remplie', rem_enable:'Activer les rappels', rem_disable:'Désactiver les rappels', rem_test:'Envoyer un test', rem_test_sent:'Notification de test envoyée.', rem_saved:'Rappels enregistrés.', rem_on_toast:'Rappels activés.', rem_off_toast:'Rappels désactivés.', rem_need_account:'Les rappels fonctionnent avec un compte, dans l’application en ligne.', rem_err_ios:'Sur iPhone, ajoute d’abord l’application à ton écran d’accueil (bouton Partager, puis « Sur l’écran d’accueil »), ouvre-la depuis cette icône, puis active les rappels.', rem_err_denied:'Les notifications sont bloquées pour ce site. Autorise-les dans les réglages de ton navigateur, puis réessaie.', rem_err_unsupported:'Ce navigateur ne gère pas les notifications. Essaie avec Chrome (Android) ou Safari (iPhone).', rem_err_other:'Les rappels n’ont pas pu être activés. Réessaie dans un moment.', rem_todo_t:'Un rappel si tu oublies une photo ?', rem_todo_d:'Une petite notification à l’heure des repas, seulement si rien n’est noté. Tu choisis les heures.', rem_todo_btn:'Choisir mes rappels',

au_signup:'Créer mon compte', au_login:'Me connecter', au_email:'Adresse e-mail', au_pass:'Mot de passe', au_pass_hint:'8 caractères minimum. Garde-le bien : il te permet de retrouver tes données sur n’importe quel téléphone.', au_forgot:'Mot de passe oublié ? Demande à ton coach de le réinitialiser.', au_signup_btn:'Créer mon compte', au_login_btn:'Me connecter', au_privacy:'Tes données sont enregistrées dans ton espace privé, sur des serveurs en Europe. Ton coach ne voit tes résultats que si tu l’acceptes.', au_bad_email:'Adresse e-mail invalide.', au_bad_pass:'Le mot de passe doit faire au moins 8 caractères.', au_exists:'Un compte existe déjà avec cette adresse : choisis « Me connecter ».', au_wrong:'Adresse ou mot de passe incorrect.', au_confirm:'Compte créé : confirme ton adresse avec l’e-mail reçu, puis connecte-toi.', au_account:'Connecté avec {e}', au_logout:'Me déconnecter', au_delete_account:'Ton compte sera aussi supprimé.', err_quota:'Tu as atteint la limite d’analyses par IA pour aujourd’hui. Tu peux encore ajouter tes repas à la main.', cfg_missing:'L’application n’est pas encore configurée : il manque l’adresse de la base de données.',
gd_t:'Guide de l’application', gd_sub:'Les menus et l’essentiel, en une minute.', gd_welcome:'Bienvenue ! Voici l’essentiel en une minute. Tu pourras revenir ici à tout moment.', gd_link:'Comment ça marche ? (guide en 1 minute)', gd_open:'Découvrir le guide de l’application', gd_start:'C’est parti', gd_print:'Imprimer ou enregistrer en PDF', gd_find:'En haut de l’écran : le bouton « ? » rouvre ce guide à tout moment (il est aussi dans Réglages), et le bouton « Aa » agrandit le texte, renforce le contraste ou passe en fond clair ou sombre.', gd_h1:'Le principe', gd_p1:'Tu prends tes repas en photo : l’app estime les calories, les sucres et les macros.|Après chaque repas, ton coach IA te répond, en style Strict ou Bienveillant.|Ton coach voit tes résultats seulement si tu l’acceptes.|Les chiffres sont des estimations : un repère, pas une mesure au gramme près.', gd_h2:'Les 5 onglets en bas de l’écran', gd_p2:'Aujourd’hui : ta journée en un coup d’œil.|Ajouter (+) : noter un repas.|Idée repas : quand tu ne sais pas quoi manger.|Suivi : ta semaine, ton corps, ton historique.|Réglages : ton profil et toutes les options.', gd_h3:'L’écran Aujourd’hui', gd_p3:'En haut : ce qu’il te reste à manger aujourd’hui, avec protéines, glucides, lipides et sucres.|Mes repas du jour : 6 cases (petit-déjeuner, collation 10 h, déjeuner, goûter 16 h, dîner, hors repas). Une photo par case et par jour ; tu peux toujours écrire un repas en plus.|Ma gourde : un geste = un verre (eau, café ou thé, jus, soda, alcool).|À faire : les petites étapes proposées (partage avec ton coach, rappels…).|Activités : ajoute ton sport, il s’ajoute à ce que tu peux manger.|Le soir : ton point du soir en quelques secondes.|Ton bilan de départ : bilan physique, profil alimentaire et personnalité, à faire quand tu veux.', gd_h4:'Noter un repas', gd_p4:'Touche une case repas : l’appareil photo s’ouvre, prends ton repas en photo. Photo déjà prise ? « Choisir dans la galerie », sous les cases.|Indique ta faim (de 1 à 5) et si elle est physique ou émotionnelle.|Touche « Analyser mon repas », corrige les portions si besoin, puis « Valider ce repas ».|Sans photo : « Écrire ou dicter », ou « Favoris · comme hier ».', gd_h5:'Idée repas', gd_p5:'Prends en photo ton frigo, ton placard, une vitrine ou un menu, ou écris ce que tu as sous la main.|Indique ton temps et ton matériel (micro-ondes, plaques, four : plusieurs choix possibles).|L’app te propose 3 idées : équilibrée, compromis et plaisir, chacune avec ses ingrédients et sa préparation.', gd_h6:'Suivi', gd_p6:'Semaine : ton bilan repère tes habitudes et te propose un objectif simple.|Corps : ton poids, tes mensurations et, si tu l’actives, la pesée du matin.|Historique : tes journées précédentes.|Bilan physique et photos : masse grasse estimée, objectif de tour de taille et, si tu le souhaites, photos de progression.', gd_h7:'Réglages', gd_p7:'Langue (français, anglais, portugais, espagnol ou arabe), ambiance (couleurs), lisibilité (taille du texte, contraste, fond clair ou sombre) et style de coaching.|Mode vacances : ton coach adapte ses conseils pendant tes vacances, sans pression sur le poids.|Profil, journée type, stress, santé (dont les troubles digestifs : ulcère, reflux, digestion lente, côlon irritable), allergies : à mettre à jour si ta vie change.|Suivi par mon coach : activer ou arrêter le partage.|Pesée du matin, rappels, et abonnement si ton coach l’a activé.|Mes données : tout exporter ou tout supprimer.|Mes profils : profil alimentaire et personnalité, pour que ton coach adapte ses conseils.', gd_h8:'Bon à savoir', gd_p8:'Tes données sont privées et enregistrées sur des serveurs en Europe.|Pour l’avoir comme une vraie appli : touche « 📲 Installer l’application » (écran de connexion, Aujourd’hui ou Réglages). Sur Android, un appui suffit ; sur iPhone, l’app te montre les 3 gestes à faire.|Mot de passe oublié ? Sur l’écran de connexion, touche « Mot de passe oublié ? » : tu reçois un lien par e-mail pour en choisir un nouveau.|Une question ? Demande à ton coach, ou écris avec « Ton avis » dans Réglages.',

vw_bg:'Background', vw_bg_auto:'Automatic', vw_bg_light:'Light', vw_bg_dark:'Dark', vw_bg_hint:'Automatic: follows your phone’s setting.',
bil_t:'Your starting check-up', bil_d:'Three short check-ups so your coach gets to know you and adapts the advice. Do them whenever you like.', bil_phys:'Body check-up', bil_phys_d:'Measurements, estimated body fat, waist goal', bil_food:'My eating profile', bil_food_d:'Emotions, cravings, control, relationship with the scale', bil_perso:'My personality', bil_perso_d:'Your main tendencies, for coaching that suits you', bil_min:'{m} min', bil_start:'Start', bil_done:'Done', bil_back:'Back', bil_finish:'Finish', bil_redo:'Redo', bil_erase:'Delete', bil_erased:'Profile deleted.', bil_share:'Show this profile to my coach', bil_general:'These are broad general tendencies, not a diagnosis. You can redo or delete this test at any time.', bil_answer_all:'Answer all the questions.', bp_intro:'Get a tape measure (or a piece of string and a ruler). Measure in the morning, before eating, without pulling the tape tight, breathing out normally, without holding your stomach in.', bp_how_waist:'Waist: halfway between your lowest rib and the top of your hips (often at belly-button level).', bp_how_neck:'Neck: just below the Adam’s apple, tape sloping slightly forward.', bp_how_hips:'Hips: at the widest part of your buttocks.', neck:'Neck', bp_opt:'optional', bp_need:'Enter your weight, waist and neck.', bp_need_f:'Enter your weight and your waist, neck and hip measurements.', bp_see:'See my check-up', bp_res_t:'Your body check-up', bp_fat:'Estimated body fat', bp_fat_range:'Likely range: {a} to {b} %', bp_fat_note:'Calculated from your tape measurements (US Navy method). It is a guide, not an exact measurement.', bp_no_fat:'The body fat estimate needs your waist, your neck and your height (in your profile).', bp_rth:'Waist / height', bp_zone_ok:'Healthy zone', bp_zone_mid:'Above the healthy zone', bp_zone_high:'Well above', bp_rth_d:'A recognised guide for belly fat: ideally, your waist stays under half your height.', bp_target:'Your health goal: a waist under {t} cm.', bp_target_short:'Waist goal', bp_margin:'Your room for progress: about {d} cm, at your own pace.', bp_in_zone:'You are already in the healthy zone: the goal is to stay there and feel good.', bp_slow:'The body changes slowly, and measurements vary from day to day with meals, stress or digestion. Redo this check-up in 4 weeks, in the same conditions.', bp_soft:'Your measurements are saved. Here, the focus is on your well-being and habits, with no body fat figure.', bp_last:'Last check-up: {d}', bp_new:'New body check-up', bp_none:'Do your body check-up: a few tape measurements are all it takes.', bp_due_t:'Your monthly check-up', bp_due_d:'It has been 4 weeks: measure again to see how far you have come.', ph_t:'Progress photos', ph_intro:'One photo from the front and one from the side, about once a month, to see how you change. It is optional: you choose.', ph_how_t:'For photos you can compare', ph_how:'Same place, same light, in the morning before eating.|Fitted clothes or underwear, always the same.|Phone at chest height, 2 to 3 metres away (timer or someone to help).|Standing naturally, arms by your sides, without holding your stomach in.', ph_priv:'Your photos are stored securely on servers in Europe. Nobody sees them but you, except your coach if you choose. They are never analysed by AI, and you can delete them at any time.', ph_adult:'Adults only.', ph_accept:'I agree, take my photos', ph_no:'No thanks', ph_discover:'Find out more', ph_take_d:'Take one photo from the front and one from the side. You can also take just one.', ph_front:'Front', ph_side:'Side', ph_take:'Take the photo', ph_retake:'Retake', ph_save:'Save my photos', ph_saved:'Photos saved.', ph_need_one:'Add at least one photo.', ph_err:'The photos could not be saved. Try again in a moment.', ph_unavail:'Progress photos are not available yet. Try again later.', ph_need_account:'Progress photos work with an account, in the online app.', ph_done_t:'Saved', ph_next:'Next photos in about 4 weeks, in the same conditions.', ph_last:'Latest: {d}', ph_new:'New photos', ph_compare:'Compare', ph_del:'Delete these photos', ph_del_q:'Delete the photos from {d}?', ph_deleted:'Photos deleted.', ph_cmp_t:'Compare my photos', ph_cmp_from:'Before', ph_cmp_to:'After', ph_cmp_wait:'To compare, you need at least 4 weeks between two sessions: before that, differences mostly come from water, your last meal or the light. Next comparison possible on {d}.', ph_cmp_need:'You need at least two photo sessions to compare.', ph_share:'Share my photos with my coach', ph_share_on:'Your coach can see your photos.', ph_share_off:'Only you can see your photos.', ph_due_t:'New photos?', ph_due_d:'It has been 4 weeks since your last progress photos.', ph_reassure_t:'Worth remembering', ph_r1:'A photo is a moment: light, time of day, your last meal or water change it. What matters is the trend over several weeks.', ph_r2:'The body changes slowly, and that is normal: it varies a little with what you eat, salt, stress, sleep or hormones.', ph_r3:'Don’t judge yourself on a single photo. Compare in a month instead, in the same conditions.', ph_r4:'Real progress shows elsewhere too: energy, sleep, clothes that feel more comfortable, mood.', ph_r5:'A slightly bloated belly on some days is normal (salty meal, digestion, stress): it goes away in a day or two.', ph_r6:'You are doing this for yourself, not for a perfect image. Taking this moment is already progress.', ph_r7:'From one day to the next, photos and the scale go up and down: only the trend over 4 to 8 weeks means something.', ph_r8:'Talk to yourself the way you would talk to someone you love: look at what is moving forward, not only at what is left.', ef_d:'Answer spontaneously: there are no right or wrong answers.', ef_lo:'Never', ef_hi:'Very often', ef_q_emo1:'When I am stressed, sad or tired, I feel like eating.', ef_q_emo2:'I eat to comfort myself or treat myself after a hard day.', ef_q_ext1:'When I see or smell something tasty, I eat it even if I am not hungry.', ef_q_ext2:'I eat more in front of a screen or when I am with other people.', ef_q_res1:'I hold back from eating to control my weight.', ef_q_res2:'After a period of holding back, I end up giving in.', ef_q_img1:'My weight or appearance strongly affects my mood.', ef_q_img2:'I often weigh myself or check my body.', ef_mot_q:'Today, about my eating…', ef_mot_think:'I am thinking about it', ef_mot_ready:'I want to change', ef_mot_started:'I have already started changing', ef_mot_keep:'I want to keep my good habits', ef_see:'See my profile', ef_res_t:'Your eating profile', ef_dim_emo:'Emotional eating', ef_dim_ext:'Cravings triggered by your surroundings', ef_dim_res:'Control and restriction', ef_dim_img:'Weight and self-image', lv_low:'Low tendency', lv_mid:'Medium tendency', lv_high:'Strong tendency', ef_balanced:'No marked tendency: your relationship with food seems fairly balanced. Your coach will help you keep it that way.', ef_tip:'Idea:', ef_txt_emo:'Food sometimes helps soothe an emotion. That is very common, and it can be worked on.', ef_tip_emo:'Before eating, ask yourself “hunger or emotion?”. If it is an emotion, try something else first: a walk, a call to someone, a cup of tea.', ef_txt_ext:'The urge to eat often comes from your surroundings: sight, smell, a screen, drinks with friends.', ef_tip_ext:'Eat at the table, without a screen, serve your plate in advance and keep temptations out of sight.', ef_txt_res:'You control what you eat a lot. Too much restriction often leads to giving in.', ef_tip_res:'Full, regular meals, no forbidden foods and some flexibility: that is what works in the long run.', ef_txt_img:'Weight and appearance weigh on your mood.', ef_tip_img:'Track other signs of progress too (energy, sleep, clothes) and weigh yourself less often.', ef_motr_think:'You are thinking about it: we go step by step, with no pressure.', ef_motr_ready:'You want to change: your coach will suggest small, concrete goals.', ef_motr_started:'You have already started: well done, let’s consolidate your new habits.', ef_motr_keep:'You want to keep your good habits: your coach will help you maintain them.', ef_care:'If eating or your self-image makes you suffer, talking to a professional (doctor, dietitian, psychologist) can really help.', pe_d:'Say how much each sentence sounds like you.', pe_lo:'Not at all', pe_hi:'Completely', pe_q_org1:'I like following a precise, organised plan.', pe_q_org2:'I often do things at the last minute.', pe_q_sto1:'I worry easily.', pe_q_sto2:'I stay calm in difficult situations.', pe_q_nov1:'I like discovering new recipes and new flavours.', pe_q_nov2:'I prefer my habits and rarely change.', pe_q_soc1:'Sharing my progress with others motivates me.', pe_q_soc2:'I prefer to move forward on my own, without talking about it.', pe_see:'See my tendencies', pe_res_t:'Your main tendencies', pe_dim_org:'Organisation', pe_dim_sto:'Stress', pe_dim_nov:'Curiosity', pe_dim_soc:'Motivation', pe_org_a:'Likes a clear plan', pe_org_b:'Prefers flexibility', pe_sto_a:'Sensitive to stress', pe_sto_b:'Rather calm', pe_nov_a:'Likes new things', pe_nov_b:'Likes routine', pe_soc_a:'Motivated by sharing', pe_soc_b:'Moves forward independently', pe_adapt_t:'How your coach adapts', pe_ad_org_a:'Clear guidelines: meal times, portions, sample menus.', pe_ad_org_b:'Flexible tips that fit easily into your day.', pe_ad_sto_a:'An especially reassuring tone, with no pressure.', pe_ad_sto_b:'A more direct, to-the-point tone.', pe_ad_nov_a:'Varied ideas and new recipes.', pe_ad_nov_b:'Small tweaks to your usual dishes.', pe_ad_soc_a:'Encouragement to share your progress.', pe_ad_soc_b:'Independence: you move forward at your own pace.', pe_ad_mid:'{x}: a balance between the two.', pf_t:'My profiles', cb_t:'Starting check-up', cb_rth:'waist / height {v}', cb_target:'goal < {t} cm', cb_fat:'body fat ≈ {v} %', cb_photos_none:'No photos shared.',
in_t:'Install the app', in_d:'Add Coach Assiette to your home screen: it will open like a real app, full screen.', in_btn:'Install the app', in_first_ios:'On iPhone, install it before you sign up: you will then open the app from its icon.', in_done:'Installed! Find Coach Assiette on your home screen.', in_ok:'The app is installed: you are using it from its icon.', in_sum_ok:'Installed', in_sum_no:'Not installed yet', in_ios_t:'On iPhone, in 3 steps', in_ios_1:'Tap the Share button (a square with an arrow pointing up): at the bottom of Safari or in its “⋯” menu, top right in Chrome.', in_ios_2:'Scroll down and choose “Add to Home Screen”. Can’t see it? Open this link in Safari first.', in_ios_3:'Tap “Add”: the Coach Assiette icon appears on your home screen.', in_ios_after:'Then open the app from that icon (sign in if it asks you to). On iPhone, meal reminders only work from the installed app.', in_and_t:'On Android, in 3 steps', in_and_1:'Open the browser menu: ⋮ at the top right in Chrome, ≡ at the bottom in Samsung Internet.', in_and_2:'Choose “Install app” or “Add to Home screen”. Can’t see it? Choose “Open in Chrome” first.', in_and_3:'Confirm: the Coach Assiette icon appears on your home screen.', in_app_t:'First open this link in your browser', in_app_d:'You are in another app’s browser (Instagram, Facebook…), which does not allow installing. Tap the ⋯ or ⋮ menu, choose “Open in browser” (or “Open in Safari / Chrome”), then tap “Install the app” again.', in_pc:'On a computer, in Chrome or Edge: click the install icon on the right of the address bar, or “Install Coach Assiette” in the ⋮ menu. On a phone, open the same link and tap “Install the app”.', in_did:'Done',

rights:'All rights reserved', terms_link:'Terms of use', au_terms:'I accept the terms of use', au_terms_read:'Read', au_need_terms:'Tick the box to accept the terms of use.', tm_t:'Terms of use', tm_date:'Version of 14 October 2026', tm_intro:'Coach Assiette is a nutrition coaching app created by {o}. By creating an account, you accept the terms below.', tm_h1:'1. What the app does', tm_p1:'It estimates the calories, macronutrients and sugars of your meals from photos or descriptions, and gives you coaching advice. These estimates are indicative: the app does not replace a doctor, a dietitian or an allergist.', tm_h2:'2. Your account', tm_p2:'Your account is personal: do not share it and keep your password to yourself. The app is for people aged 18 and over.', tm_h3:'3. Intellectual property', tm_p3:'The app (its code, design, texts, questionnaires, the name “Coach Assiette” and its logo) belongs to {o}. All rights reserved. Copying, reproducing, modifying, reselling, making available to others or using it commercially, in whole or in part, is forbidden without written permission (articles L.122-4 and L.335-2 of the French Intellectual Property Code).', tm_h4:'4. Your data', tm_p4:'Your data is stored on servers in Europe and is never sold. Photos are sent to an artificial intelligence service only to be analysed: the app does not keep them. Your coach only sees your results if you agree, and you can withdraw this at any time. You can export or delete all your data, and your account, from Settings.', tm_h5:'5. Free access or subscription', tm_p5:'Depending on what your coach decides, your access is free or requires a monthly subscription. The subscription is paid by card or SEPA direct debit through Stripe; your coach never sees your bank details. You can cancel at any time from Settings: it stays active until the end of the paid period. If a payment fails, photo analysis and AI advice are paused; your data remains available.', tm_h6:'6. Changes', tm_p6:'The app may change, be modified or stopped. If these terms change significantly, they will be shown to you again.', tm_h7:'7. Applicable law', tm_p7:'These terms are governed by French law.', tm_accept:'I accept', tm_gate:'Before you continue, please read and accept the terms of use.', s_pay:'My subscription', pay_t:'Subscription', pay_d:'To analyse your meals from photos and get AI advice, a monthly subscription is needed. You can cancel whenever you like.', pay_price:'{p} per month', pay_go:'Subscribe', pay_manage:'Manage my subscription (payment, cancellation)', pay_secure:'Secure payment by Stripe, by card or SEPA direct debit. Your coach never sees your bank details.', pay_meanwhile:'Meanwhile, you can keep logging your meals by hand.', pay_ai_off:'AI analysis is paused: your subscription is not active. You can log your meal by hand, or subscribe in Settings > My subscription.', pay_banner_t:'Photo analysis paused', pay_banner_d:'Your subscription is not active. You can keep logging your meals by hand.', pay_see:'See the subscription', pay_late_banner:'Your last payment did not go through. Update your payment method to keep photo analysis.', pay_s_free:'Free', pay_s_active:'Active', pay_s_late:'Payment to fix', pay_s_none:'To activate', pay_s_proc:'Being confirmed', pay_free_d:'Your coach gives you free access to the app: there is nothing to pay.', pay_active_d:'Subscription active. Next payment on {d}.', pay_active_end:'Subscription cancelled: it stays active until {d}.', pay_late_d:'Your last payment did not go through. Update your payment method in the next few days to keep photo analysis.', pay_late_off:'Your payment did not go through: photo analysis is paused. Update your payment method to turn it back on.', pay_proc:'Your payment is being confirmed (a SEPA direct debit can take a few days). You can already use the app.', pay_thanks:'Thank you! Your subscription is active.', pay_pending:'Payment received: it is being confirmed.', pay_cancelled:'Payment cancelled: nothing was charged.', pay_already:'You already have an active subscription.', pay_not_ready:'Payment is not available yet. Try again later or ask your coach.', pay_price_loading:'Loading the price…', ct_follow:'Follow-up', ct_bill:'Subscriptions', bill_t:'Paid subscriptions', bill_off_d:'Off: everyone uses the app for free. You can already choose below who will be free and who will pay.', bill_on_d:'On: “Paid” people need an up-to-date subscription for photo analysis and AI advice.', bill_turn_on:'Turn on subscriptions', bill_turn_off:'Turn off subscriptions', bill_need_stripe:'Turn on only once your Stripe account is connected to the app.', bill_confirm_on:'Turn on subscriptions? “Paid” people without a subscription will no longer be able to analyse their photos (they can still log meals by hand).', bill_confirm_yes:'Yes, turn on', bill_default_t:'New accounts', bill_default_d:'Rule applied to anyone you have not set individually.', bill_free:'Free', bill_paid:'Paid', bill_add_t:'Set a person by email', bill_add_d:'Also works before they create their account, for example to give your family free access.', bill_set_free:'Give free access', bill_set_paid:'Make paid', bill_list_t:'All accounts', bill_sum:'{a} up-to-date subscriber(s) · {f} free access · {n} account(s)', bill_me:'You (coach)', bill_invited:'Not signed up yet', bill_st_active:'Subscribed', bill_st_late:'Payment late', bill_st_none:'Not subscribed', bill_st_free:'Free', bill_by_default:'Follows the “New accounts” rule', bill_next:'Next payment on {d}', bill_ends:'Ends on {d}', bill_saved:'Saved.', bill_err:'Could not load subscriptions. Check that the latest version of the database is installed.', bill_bad_email:'Invalid email address.', bill_help:'Subscription money is paid by Stripe straight into your bank account. People with free access never see anything about payment.',

gd_t:'App guide', gd_sub:'The menus and the essentials, in one minute.', gd_welcome:'Welcome! Here are the essentials in one minute. You can come back here at any time.', gd_link:'How does it work? (1-minute guide)', gd_open:'Discover the app guide', gd_start:'Let’s go', gd_print:'Print or save as PDF', gd_find:'At the top of the screen: the “?” button reopens this guide at any time (it is also in Settings), and the “Aa” button makes the text bigger, increases the contrast or switches to a light or dark background.', gd_h1:'How it works', gd_p1:'You take photos of your meals: the app estimates calories, sugars and macros.|After each meal, your AI coach replies, in Strict or Supportive style.|Your coach sees your results only if you agree.|The numbers are estimates: a reference point, not a measurement to the gram.', gd_h2:'The 5 tabs at the bottom of the screen', gd_p2:'Today: your day at a glance.|Add (+): log a meal.|Meal ideas: when you don’t know what to eat.|Progress: your week, your body, your history.|Settings: your profile and all the options.', gd_h3:'The Today screen', gd_p3:'At the top: what you have left to eat today, with protein, carbs, fat and sugars.|Today’s meals: 6 boxes (breakfast, 10 am snack, lunch, 4 pm snack, dinner, between meals). One photo per box per day; you can always type an extra meal.|My water bottle: one tap = one glass (water, coffee or tea, juice, soda, alcohol).|To do: small suggested steps (sharing with your coach, reminders…).|Activities: add your exercise, it adds to what you can eat.|In the evening: your evening check-in in a few seconds.|Your starting check-up: body check-up, eating profile and personality, whenever you like.', gd_h4:'Logging a meal', gd_p4:'Tap a meal box: the camera opens, take a photo of your meal. Already took it? “Choose from gallery”, under the boxes.|Say how hungry you are (1 to 5) and whether it is physical or emotional hunger.|Tap “Analyse my meal”, adjust the portions if needed, then “Confirm this meal”.|Without a photo: “Type or dictate”, or “Favourites · like yesterday”.', gd_h5:'Meal ideas', gd_p5:'Take a photo of your fridge, cupboard, a shop window or a menu, or type what you have at hand.|Say how much time you have and your equipment (microwave, hob, oven: you can pick several).|The app suggests 3 ideas: balanced, middle ground and treat, each with its ingredients and preparation.', gd_h6:'Progress', gd_p6:'Week: your review spots your habits and suggests one simple goal.|Body: your weight, your measurements and, if you turn it on, the morning weigh-in.|History: your previous days.|Body check-up and photos: estimated body fat, waist goal and, if you wish, progress photos.', gd_h7:'Settings', gd_p7:'Language (French, English, Portuguese, Spanish or Arabic), theme (colours), readability (text size, contrast, light or dark background) and coaching style.|Holiday mode: your coach adapts the advice during your holiday, with no pressure on your weight.|Profile, typical day, stress, health (including digestive issues: ulcer, reflux, slow digestion, irritable bowel), allergies: update them if your life changes.|Followed by my coach: turn sharing on or off.|Morning weigh-in, reminders, and subscription if your coach has turned it on.|My data: export everything or delete everything.|My profiles: eating profile and personality, so your coach can adapt the advice.', gd_h8:'Good to know', gd_p8:'Your data is private and stored on servers in Europe.|To have it like a real app: tap “📲 Install the app” (sign-in screen, Today or Settings). On Android, one tap is enough; on iPhone, the app shows you the 3 steps.|Forgot your password? On the sign-in screen, tap “Forgot your password?”: you will receive a link by email to choose a new one.|A question? Ask your coach, or write to us with “Your feedback” in Settings.',

wg_s:'Morning weigh-in (optional)', wg_t:'Morning weigh-in', wg_intro:'One weigh-in every morning, in the same conditions, to follow your trend over the week and the month. It is optional and you can stop whenever you like.', wg_time:'I weigh myself around', wg_cond_t:'So that your weigh-ins can be compared from one day to the next, I commit to weighing myself:', wg_c_wake:'In the morning, when I wake up, after going to the toilet', wg_c_fast:'On an empty stomach, before drinking or eating', wg_c_outfit:'Always in the same outfit, as light as possible (for example just before getting dressed)', wg_c_scale:'On the same scale, in the same place, on a hard floor', wg_need_all:'Tick the 4 conditions to turn on the morning weigh-in.', wg_share:'Your weigh-ins are visible to your coach only if sharing with your coach is on.', wg_enable:'Turn on the morning weigh-in', wg_disable:'Stop the morning weigh-in', wg_on_toast:'Morning weigh-in on.', wg_off_toast:'Morning weigh-in stopped.', wg_time_saved:'Time saved.', wg_blocked:'Given what you entered in “My health”, the daily weigh-in is not offered: it is not advised without a professional’s opinion. Talk to your coach or your doctor.', wg_sub_on:'On · {h}', wg_today_t:'Morning weigh-in', wg_today_d:'If you wish, it is time to weigh yourself. It is only a reference point.', wg_go:'Weigh in', wg_edit:'Edit', wg_skip:'Not today', wg_rem_t:'An indicative number, not a goal', wg_rem_p1:'Your weight naturally moves from one day to the next: from a few hundred grams up to 1 to 2 kg over a few days, with no change in your body fat. Today’s number is only a reference point: what matters is the trend over a week or a month.', wg_rem_why:'What makes today’s weight vary:', wg_f_water:'Water and meals: everything you drink and eat has a weight (1 litre of water = 1 kg) until your body gets rid of it.', wg_f_salt:'Salt: a salty meal makes you hold water for a while.', wg_f_carbs:'Carbohydrates: the body stores them with water (about 3 g of water per gram). A starchy meal can push the scale up with no fat gain.', wg_f_heat:'Heat and exercise: sweating makes you lose water; your weight goes back up when you drink.', wg_f_stress:'Stress and lack of sleep: they can affect water retention and appetite.', wg_f_cycle:'The menstrual cycle: about +0.5 kg on average during your period, sometimes more.', wg_f_transit:'Digestion: what is still in your gut also counts on the scale.', wg_f_week:'Weekends: weight goes up by about 0.35% on average and comes back down during the week.', wg_weight:'Weight (kg)', wg_at:'Time of the weigh-in', wg_check_t:'This morning, I weighed myself:', wg_check_hint:'If a condition is not met, your weigh-in is saved but does not count in your trend.', wg_save:'Save my weigh-in', wg_need_w:'Enter your weight in kg (for example 72.5).', wg_saved:'Weigh-in saved.', wg_saved_off:'Weigh-in saved outside the conditions: it does not count in your trend.', wg_trend:'7-day trend', wg_evol:'{d} kg in 2 weeks', wg_evol_same:'Stable over 2 weeks', wg_trend_wait:'Your trend will appear after 3 weigh-ins in the conditions within 7 days.', wg_reg:'{n} weigh-in(s) over the last 7 days, {k} in the conditions', wg_alert:'Your trend is going down fast: more than 1 kg per week for 3 weeks. Losing weight too fast is not advisable: talk to your coach or your doctor.', wg_offcond:'outside conditions', wg_promo_t:'Morning weigh-in (optional)', wg_promo_d:'One weigh-in every morning in the same conditions to follow your trend over the week and the month.', wg_rem_notif:'Weigh-in reminder at {h}', wg_chart_legend:'Dots: morning weigh-ins (empty circles = outside conditions) · Line: 7-day average', wg_yes:'Yes', wg_no:'No', coach_weigh:'Morning weigh-in ({h}): trend {w} · {e} in 2 weeks · {n}/7 weigh-ins, {k} in the conditions', coach_weigh_alert:'Fast loss: more than 1 kg per week for 3 weeks.', coach_weigh_alert_short:'⚖️ Fast loss', col_wi:'Morning weigh-in', col_at:'Time', col_cond:'Conditions met',

bil_t:'O teu balanço inicial', bil_d:'Três pequenos balanços para o teu coach te conhecer melhor e adaptar os conselhos. Faz quando quiseres.', bil_phys:'Balanço físico', bil_phys_d:'Medidas, massa gorda estimada, objetivo de perímetro da cintura', bil_food:'O meu perfil alimentar', bil_food_d:'Emoções, vontades, controlo, relação com a balança', bil_perso:'A minha personalidade', bil_perso_d:'As tuas grandes tendências, para um coaching à tua medida', bil_min:'{m} min', bil_start:'Começar', bil_done:'Feito', bil_back:'Voltar', bil_finish:'Terminar', bil_redo:'Refazer', bil_erase:'Apagar', bil_erased:'Perfil apagado.', bil_share:'Mostrar este perfil ao meu coach', bil_general:'São grandes tendências gerais, não um diagnóstico. Podes refazer ou apagar este teste quando quiseres.', bil_answer_all:'Responde a todas as perguntas.', bp_intro:'Usa uma fita métrica (ou um fio e uma régua). Mede-te de manhã, antes de comer, sem apertar a fita, a respirar normalmente e sem encolher a barriga.', bp_how_waist:'Cintura: a meio caminho entre a última costela e o topo da anca (muitas vezes à altura do umbigo).', bp_how_neck:'Pescoço: logo abaixo da maçã de Adão, com a fita ligeiramente inclinada para a frente.', bp_how_hips:'Anca: na parte mais larga das nádegas.', neck:'Pescoço', bp_opt:'opcional', bp_need:'Indica o teu peso, a cintura e o pescoço.', bp_need_f:'Indica o teu peso e as medidas da cintura, do pescoço e da anca.', bp_see:'Ver o meu balanço', bp_res_t:'O teu balanço físico', bp_fat:'Massa gorda estimada', bp_fat_range:'Intervalo provável: de {a} a {b} %', bp_fat_note:'Cálculo a partir das tuas medidas com fita (método da Marinha americana). É uma referência, não uma medição exata.', bp_no_fat:'A estimativa da massa gorda precisa da cintura, do pescoço e da tua altura (no teu perfil).', bp_rth:'Cintura / altura', bp_zone_ok:'Zona favorável', bp_zone_mid:'Acima da zona favorável', bp_zone_high:'Bem acima', bp_rth_d:'Uma referência reconhecida para a gordura da barriga: idealmente, a cintura fica abaixo de metade da altura.', bp_target:'O teu objetivo de saúde: uma cintura abaixo de {t} cm.', bp_target_short:'Objetivo de cintura', bp_margin:'A tua margem de progresso: cerca de {d} cm, ao teu ritmo.', bp_in_zone:'Já estás na zona favorável: o objetivo é manteres-te lá e sentires-te bem.', bp_slow:'O corpo muda devagar, e as medidas variam de um dia para o outro com as refeições, o stress ou a digestão. Refaz este balanço daqui a 4 semanas, nas mesmas condições.', bp_soft:'As tuas medidas estão guardadas. Aqui, acompanhamos sobretudo o teu bem-estar e os teus hábitos, sem número de massa gorda.', bp_last:'Último balanço: {d}', bp_new:'Novo balanço físico', bp_none:'Faz o teu balanço físico: bastam algumas medidas com fita.', bp_due_t:'O teu balanço do mês', bp_due_d:'Já passaram 4 semanas: volta a medir para ver o caminho percorrido.', ph_t:'Fotos de progresso', ph_intro:'Uma foto de frente e uma de perfil, cerca de uma vez por mês, para veres a tua evolução. É opcional: és tu que escolhes.', ph_how_t:'Para fotos comparáveis', ph_how:'Mesmo sítio, mesma luz, de manhã antes de comer.|Roupa justa ou roupa interior, sempre a mesma.|Telemóvel à altura do peito, a 2 ou 3 metros (temporizador ou alguém para ajudar).|De pé, em posição natural, braços ao longo do corpo, sem encolher a barriga.', ph_priv:'As tuas fotos ficam guardadas de forma segura em servidores na Europa. Ninguém as vê além de ti, exceto o teu coach se assim escolheres. Nunca são analisadas pela IA e podes apagá-las a qualquer momento.', ph_adult:'Reservado a maiores de idade.', ph_accept:'Aceito, tirar as minhas fotos', ph_no:'Prefiro não', ph_discover:'Saber mais', ph_take_d:'Tira uma foto de frente e uma de perfil. Também podes tirar só uma.', ph_front:'De frente', ph_side:'De perfil', ph_take:'Tirar a foto', ph_retake:'Repetir', ph_save:'Guardar as minhas fotos', ph_saved:'Fotos guardadas.', ph_need_one:'Adiciona pelo menos uma foto.', ph_err:'Não foi possível guardar as fotos. Tenta outra vez daqui a pouco.', ph_unavail:'As fotos de progresso ainda não estão disponíveis. Tenta mais tarde.', ph_need_account:'As fotos de progresso funcionam com uma conta, na aplicação online.', ph_done_t:'Está guardado', ph_next:'Próximas fotos daqui a cerca de 4 semanas, nas mesmas condições.', ph_last:'Últimas: {d}', ph_new:'Novas fotos', ph_compare:'Comparar', ph_del:'Apagar estas fotos', ph_del_q:'Apagar as fotos de {d}?', ph_deleted:'Fotos apagadas.', ph_cmp_t:'Comparar as minhas fotos', ph_cmp_from:'Antes', ph_cmp_to:'Depois', ph_cmp_wait:'Para comparar, são precisas pelo menos 4 semanas entre duas sessões: antes disso, as diferenças vêm sobretudo da água, da última refeição ou da luz. Próxima comparação possível a {d}.', ph_cmp_need:'São precisas pelo menos duas sessões de fotos para comparar.', ph_share:'Partilhar as minhas fotos com o meu coach', ph_share_on:'O teu coach pode ver as tuas fotos.', ph_share_off:'As tuas fotos só são visíveis para ti.', ph_due_t:'Novas fotos?', ph_due_d:'Já passaram 4 semanas desde as tuas últimas fotos de progresso.', ph_reassure_t:'A ter em mente', ph_r1:'Uma foto é um instante: a luz, a hora, a última refeição ou a água fazem-na variar. O que conta é a tendência ao longo de várias semanas.', ph_r2:'O corpo muda devagar, e é normal: varia um pouco com o que comes, o sal, o stress, o sono ou as hormonas.', ph_r3:'Não te julgues por uma só foto. Compara antes daqui a um mês, nas mesmas condições.', ph_r4:'Os verdadeiros progressos também se veem noutras coisas: energia, sono, roupa mais confortável, humor.', ph_r5:'Uma barriga um pouco inchada em certos dias é normal (refeição salgada, digestão, stress): passa num ou dois dias.', ph_r6:'Fazes isto por ti, não por uma imagem perfeita. Tirar este momento já é avançar.', ph_r7:'De um dia para o outro, as fotos e a balança sobem e descem: só a tendência ao longo de 4 a 8 semanas faz sentido.', ph_r8:'Fala contigo como falarias com alguém de quem gostas: olha para o que avança, não só para o que falta.', ef_d:'Responde de forma espontânea: não há respostas certas nem erradas.', ef_lo:'Nunca', ef_hi:'Muitas vezes', ef_q_emo1:'Em caso de stress, tristeza ou cansaço, tenho vontade de comer.', ef_q_emo2:'Como para me reconfortar ou para me dar prazer depois de um dia difícil.', ef_q_ext1:'Quando vejo ou cheiro algo bom, como mesmo sem fome.', ef_q_ext2:'Como mais em frente a um ecrã ou quando estou com outras pessoas.', ef_q_res1:'Evito comer para controlar o meu peso.', ef_q_res2:'Depois de um período de privação, acabo por ceder.', ef_q_img1:'O meu peso ou a minha aparência influenciam muito o meu humor.', ef_q_img2:'Peso-me ou observo o meu corpo muitas vezes para verificar.', ef_mot_q:'Hoje, quanto à minha alimentação…', ef_mot_think:'Estou a pensar nisso', ef_mot_ready:'Tenho vontade de mudar', ef_mot_started:'Já comecei a mudar', ef_mot_keep:'Quero manter os meus bons hábitos', ef_see:'Ver o meu perfil', ef_res_t:'O teu perfil alimentar', ef_dim_emo:'Fome emocional', ef_dim_ext:'Vontades ligadas ao ambiente', ef_dim_res:'Controlo e restrição', ef_dim_img:'Peso e autoimagem', lv_low:'Tendência fraca', lv_mid:'Tendência média', lv_high:'Tendência forte', ef_balanced:'Sem tendência marcada: a tua relação com a comida parece bastante equilibrada. O teu coach vai ajudar-te a manter o rumo.', ef_tip:'Sugestão:', ef_txt_emo:'A comida às vezes serve para acalmar uma emoção. É muito comum, e pode ser trabalhado.', ef_tip_emo:'Antes de comer, pergunta-te «fome ou emoção?». Se for uma emoção, experimenta primeiro outra coisa: caminhar, ligar a alguém, beber um chá.', ef_txt_ext:'A vontade de comer vem muitas vezes do que te rodeia: a vista, o cheiro, um ecrã, um aperitivo.', ef_tip_ext:'Come à mesa, sem ecrã, serve o prato com antecedência e mantém as tentações fora de vista.', ef_txt_res:'Controlas muito o que comes. Demasiada restrição leva muitas vezes a ceder.', ef_tip_res:'Refeições completas e regulares, nenhum alimento proibido e alguma flexibilidade: é o que funciona a longo prazo.', ef_txt_img:'O peso e a aparência pesam no teu humor.', ef_tip_img:'Acompanha também outros sinais de progresso (energia, sono, roupa) e pesa-te menos vezes.', ef_motr_think:'Estás a pensar nisso: avançamos passo a passo, sem pressão.', ef_motr_ready:'Tens vontade de mudar: o teu coach vai propor-te pequenos objetivos concretos.', ef_motr_started:'Já começaste: parabéns, vamos consolidar os teus novos hábitos.', ef_motr_keep:'Queres manter os teus bons hábitos: o teu coach vai ajudar-te a mantê-los.', ef_care:'Se comer ou a tua imagem te fazem sofrer, falar com um profissional (médico, nutricionista, psicólogo) pode mesmo ajudar.', pe_d:'Indica até que ponto cada frase se parece contigo.', pe_lo:'Nada', pe_hi:'Totalmente', pe_q_org1:'Gosto de seguir um plano preciso e organizado.', pe_q_org2:'Faço muitas vezes as coisas à última hora.', pe_q_sto1:'Preocupo-me facilmente.', pe_q_sto2:'Mantenho a calma em situações difíceis.', pe_q_nov1:'Gosto de descobrir novas receitas e novos sabores.', pe_q_nov2:'Prefiro os meus hábitos e raramente mudo.', pe_q_soc1:'Partilhar os meus progressos com outros motiva-me.', pe_q_soc2:'Prefiro avançar por conta própria, sem falar disso.', pe_see:'Ver as minhas tendências', pe_res_t:'As tuas grandes tendências', pe_dim_org:'Organização', pe_dim_sto:'Stress', pe_dim_nov:'Curiosidade', pe_dim_soc:'Motivação', pe_org_a:'Gosta de um plano preciso', pe_org_b:'Prefere flexibilidade', pe_sto_a:'Sensível ao stress', pe_sto_b:'Lida bem com o stress', pe_nov_a:'Gosta de novidade', pe_nov_b:'Gosta dos seus hábitos', pe_soc_a:'Motivação pela partilha', pe_soc_b:'Avança com autonomia', pe_adapt_t:'Como o teu coach se adapta', pe_ad_org_a:'Referências precisas: horários, porções, menus tipo.', pe_ad_org_b:'Conselhos flexíveis, fáceis de encaixar no teu dia.', pe_ad_sto_a:'Um tom especialmente tranquilizador, sem pressão.', pe_ad_sto_b:'Um tom mais direto, sem rodeios.', pe_ad_nov_a:'Ideias variadas e novas receitas.', pe_ad_nov_b:'Pequenos ajustes nos teus pratos habituais.', pe_ad_soc_a:'Incentivo para partilhares os teus progressos.', pe_ad_soc_b:'Autonomia: avanças ao teu ritmo.', pe_ad_mid:'{x}: um equilíbrio entre os dois.', pf_t:'Os meus perfis', cb_t:'Balanço inicial', cb_rth:'cintura / altura {v}', cb_target:'objetivo < {t} cm', cb_fat:'massa gorda ≈ {v} %', cb_photos_none:'Nenhuma foto partilhada.',
in_t:'Instalar a aplicação', in_d:'Adiciona o Coach Assiette ao ecrã principal: abre-se como uma verdadeira aplicação, em ecrã inteiro.', in_btn:'Instalar a aplicação', in_first_ios:'No iPhone, instala-a antes de te registares: depois abres a aplicação a partir do ícone.', in_done:'Está instalada! Encontra o Coach Assiette no teu ecrã principal.', in_ok:'A aplicação está instalada: estás a usá-la a partir do ícone.', in_sum_ok:'Instalada', in_sum_no:'Ainda não instalada', in_ios_t:'No iPhone, em 3 gestos', in_ios_1:'Toca no botão Partilhar (um quadrado com uma seta para cima): em baixo no Safari ou no menu «⋯», em cima à direita no Chrome.', in_ios_2:'Desliza e escolhe «Adicionar ao ecrã principal». Não aparece? Abre primeiro este link no Safari.', in_ios_3:'Toca em «Adicionar»: o ícone do Coach Assiette aparece no ecrã principal.', in_ios_after:'Depois abre a aplicação a partir desse ícone (inicia sessão se for pedido). No iPhone, os lembretes de refeição só funcionam a partir da aplicação instalada.', in_and_t:'No Android, em 3 gestos', in_and_1:'Abre o menu do navegador: ⋮ em cima à direita no Chrome, ≡ em baixo no Samsung Internet.', in_and_2:'Escolhe «Instalar aplicação» ou «Adicionar ao ecrã principal». Não aparece? Escolhe primeiro «Abrir no Chrome».', in_and_3:'Confirma: o ícone do Coach Assiette aparece no ecrã principal.', in_app_t:'Abre primeiro este link no navegador', in_app_d:'Estás no navegador de outra aplicação (Instagram, Facebook…), que não permite instalar. Toca no menu ⋯ ou ⋮, escolhe «Abrir no navegador» (ou «Abrir no Safari / Chrome») e toca outra vez em «Instalar a aplicação».', in_pc:'No computador, no Chrome ou no Edge: clica no ícone de instalação à direita da barra de endereço, ou em «Instalar Coach Assiette» no menu ⋮. No telemóvel, abre o mesmo link e toca em «Instalar a aplicação».', in_did:'Feito',
vac_t:'Modo férias', vac_d:'Nas férias o ritmo muda: mexes-te de outra forma, comes mais vezes fora ou em família, às vezes bebes mais. Ativa este modo para o teu coach adaptar os conselhos, sem pressão sobre o peso.', vac_from:'De', vac_to:'Até (opcional)', vac_move:'Nestas férias, mexo-me', vac_less:'Menos', vac_same:'O mesmo', vac_more:'Mais', vac_move_hint:'«Menos» baixa um pouco as tuas necessidades estimadas, «Mais» aumenta-as um pouco.', vac_pause_weigh:'Pôr a pesagem da manhã em pausa durante as férias', vac_on:'Ativar o modo férias', vac_off:'Terminar as minhas férias', vac_on_toast:'Modo férias ativado. Boas férias!', vac_off_toast:'Modo férias terminado.', vac_sum_on:'Ativo até {d}', vac_sum_open:'Ativo', vac_today_d:'Aproveita! O teu coach adapta os conselhos: sem pressão sobre o peso, o equilíbrio vê-se na semana.', vac_until:'Até {d}', vac_back_t:'Bem-vindo de volta!', vac_back_d:'As tuas férias terminaram: o teu coaching volta ao ritmo habitual. Se a balança subiu um pouco, não te preocupes: muitas vezes é em parte água, que desaparece nas semanas seguintes.', vac_weigh_note:'Nas férias, o peso sobe muitas vezes um pouco (refeições mais salgadas, álcool, ritmo diferente). Em parte é água, que costuma desaparecer nas semanas a seguir ao regresso.', vac_badge:'De férias', vac_coach:'De férias de {a} a {b}', vac_coach_open:'De férias desde {a}', vac_bad_dates:'A data de fim tem de ser depois da data de início.',
