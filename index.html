<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coach Assiette</title>
<meta name="description" content="Coach nutrition : analyse de tes repas, coaching et idées de repas.">
<meta name="theme-color" content="#2C7868">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coach Assiette">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: phone-first app shell — sticky brand bar, one scrolling column (max 560px), fixed bottom tab bar */
/* Colour: four selectable "ambiances" (data-amb on <html>), each with a light and a dark variant. Menthe et miel is the default. */
:root{
  --bg:#F3F8F6; --surface:#FFFFFF; --surface-2:#E2EFEA; --ink:#24403A; --muted:#587069; --line:#CFE1DA; --accent:#2C7868; --accent-ink:#FFFFFF; --accent-soft:#D5ECE5; --sage:#256A55; --sage-soft:#D9EFE6; --ochre:#7A5A12; --ochre-soft:#FBEFD5; --danger:#A23D31; --danger-soft:#F9E3DF; --warm:#8A5A0C; --warm-soft:#FCF0D2; --warm-bar:#E0A43A; color-scheme:light;
  --font-display:"Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-body:"Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:18px; --r-s:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0F1715; --surface:#16211E; --surface-2:#1F2E2A; --ink:#E3EFEB; --muted:#9DB3AC; --line:#2A3B37; --accent:#6FC7B2; --accent-ink:#08201B; --accent-soft:#1D3A33; --sage:#7FCDB5; --sage-soft:#1C352E; --ochre:#E8B85A; --ochre-soft:#372B12; --danger:#F08A7C; --danger-soft:#3B1E1A; --warm:#F0C46A; --warm-soft:#3A2E14; --warm-bar:#E0A43A; color-scheme:dark }}
:root[data-theme="dark"]{ --bg:#0F1715; --surface:#16211E; --surface-2:#1F2E2A; --ink:#E3EFEB; --muted:#9DB3AC; --line:#2A3B37; --accent:#6FC7B2; --accent-ink:#08201B; --accent-soft:#1D3A33; --sage:#7FCDB5; --sage-soft:#1C352E; --ochre:#E8B85A; --ochre-soft:#372B12; --danger:#F08A7C; --danger-soft:#3B1E1A; --warm:#F0C46A; --warm-soft:#3A2E14; --warm-bar:#E0A43A; color-scheme:dark }
:root[data-amb="sauge"]{ --bg:#F5F8F2; --surface:#FFFFFF; --surface-2:#E9F0E6; --ink:#2D3B33; --muted:#5F6E64; --line:#D5E0D1; --accent:#48775A; --accent-ink:#FFFFFF; --accent-soft:#DCEBDD; --sage:#346B44; --sage-soft:#DDEEDF; --ochre:#7A5A12; --ochre-soft:#FBEFD5; --danger:#A23D31; --danger-soft:#F9E3DF; --warm:#8A4A1F; --warm-soft:#FCE6D4; --warm-bar:#E8955E; }
@media (prefers-color-scheme: dark){ :root[data-amb="sauge"]:not([data-theme="light"]){ --bg:#121812; --surface:#1A221B; --surface-2:#243026; --ink:#E5EDE5; --muted:#A0AFA2; --line:#2E3B30; --accent:#8CC39A; --accent-ink:#0E2014; --accent-soft:#213826; --sage:#8CC39A; --sage-soft:#1E3324; --ochre:#E6B65A; --ochre-soft:#382C14; --danger:#F08A7C; --danger-soft:#3B1E1A; --warm:#F2B48A; --warm-soft:#3D271A; --warm-bar:#E8955E; color-scheme:dark }}
:root[data-amb="sauge"][data-theme="dark"]{ --bg:#121812; --surface:#1A221B; --surface-2:#243026; --ink:#E5EDE5; --muted:#A0AFA2; --line:#2E3B30; --accent:#8CC39A; --accent-ink:#0E2014; --accent-soft:#213826; --sage:#8CC39A; --sage-soft:#1E3324; --ochre:#E6B65A; --ochre-soft:#382C14; --danger:#F08A7C; --danger-soft:#3B1E1A; --warm:#F2B48A; --warm-soft:#3D271A; --warm-bar:#E8955E; color-scheme:dark }
:root[data-amb="ciel"]{ --bg:#F4F7FA; --surface:#FFFFFF; --surface-2:#E6EDF4; --ink:#26364A; --muted:#5B6B7C; --line:#D3DDE8; --accent:#3F6F99; --accent-ink:#FFFFFF; --accent-soft:#DCE8F3; --sage:#276A4F; --sage-soft:#DCEFE5; --ochre:#7A5A12; --ochre-soft:#FBEFD5; --danger:#A23D31; --danger-soft:#F9E3DF; --warm:#7A5A1E; --warm-soft:#F8EBD3; --warm-bar:#D9A85A; }
@media (prefers-color-scheme: dark){ :root[data-amb="ciel"]:not([data-theme="light"]){ --bg:#0F151C; --surface:#161F29; --surface-2:#1F2B38; --ink:#E3EAF2; --muted:#9AABBD; --line:#2A3847; --accent:#8DB8E0; --accent-ink:#0B1D2E; --accent-soft:#1D3147; --sage:#7CCBA6; --sage-soft:#1B3328; --ochre:#E6B65A; --ochre-soft:#382C14; --danger:#F08A7C; --danger-soft:#3B1E1A; --warm:#EBCB8E; --warm-soft:#362B17; --warm-bar:#D9A85A; color-scheme:dark }}
:root[data-amb="ciel"][data-theme="dark"]{ --bg:#0F151C; --surface:#161F29; --surface-2:#1F2B38; --ink:#E3EAF2; --muted:#9AABBD; --line:#2A3847; --accent:#8DB8E0; --accent-ink:#0B1D2E; --accent-soft:#1D3147; --sage:#7CCBA6; --sage-soft:#1B3328; --ochre:#E6B65A; --ochre-soft:#382C14; --danger:#F08A7C; --danger-soft:#3B1E1A; --warm:#EBCB8E; --warm-soft:#362B17; --warm-bar:#D9A85A; color-scheme:dark }
:root[data-amb="lavande"]{ --bg:#F7F6FB; --surface:#FFFFFF; --surface-2:#ECEAF5; --ink:#34324A; --muted:#66647C; --line:#DDDAEA; --accent:#6A5FA8; --accent-ink:#FFFFFF; --accent-soft:#E6E2F4; --sage:#33694F; --sage-soft:#DDEFE4; --ochre:#7A5A12; --ochre-soft:#FBEFD5; --danger:#A23D31; --danger-soft:#F9E3DF; --warm:#8E4E2A; --warm-soft:#FCE7DA; --warm-bar:#EE9F75; }
@media (prefers-color-scheme: dark){ :root[data-amb="lavande"]:not([data-theme="light"]){ --bg:#13121B; --surface:#1B1A26; --surface-2:#252433; --ink:#E9E7F3; --muted:#A7A4BC; --line:#32303F; --accent:#B2A8EC; --accent-ink:#1A1533; --accent-soft:#2B2747; --sage:#85C9A6; --sage-soft:#1C3327; --ochre:#E6B65A; --ochre-soft:#382C14; --danger:#F08A7C; --danger-soft:#3B1E1A; --warm:#F4BE9C; --warm-soft:#3D2619; --warm-bar:#EE9F75; color-scheme:dark }}
:root[data-amb="lavande"][data-theme="dark"]{ --bg:#13121B; --surface:#1B1A26; --surface-2:#252433; --ink:#E9E7F3; --muted:#A7A4BC; --line:#32303F; --accent:#B2A8EC; --accent-ink:#1A1533; --accent-soft:#2B2747; --sage:#85C9A6; --sage-soft:#1C3327; --ochre:#E6B65A; --ochre-soft:#382C14; --danger:#F08A7C; --danger-soft:#3B1E1A; --warm:#F4BE9C; --warm-soft:#3D2619; --warm-bar:#EE9F75; color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.shell{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:.1px;display:flex;align-items:center;gap:8px}
.brand-dot{width:22px;height:22px;border-radius:50%;background:var(--accent);display:inline-grid;place-items:center}
.brand-dot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--bg)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1.15;letter-spacing:-.2px}
h2{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.25}
h3{font-size:16px;font-weight:700}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:0 1px 2px rgba(30,50,40,.04)}
.card.flat{background:var(--surface-2);border-color:transparent}
.section{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.btn{appearance:none;border:1px solid transparent;border-radius:14px;min-height:48px;padding:10px 16px;font:600 16px/1.2 var(--font-body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface-2);color:var(--ink);text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.outline{background:var(--surface);border-color:var(--line)}
.btn.ghost{background:transparent;min-height:40px;padding:8px 10px;color:var(--muted)}
.btn.big{min-height:58px;font-size:18px;font-weight:700}
.btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
label.btn{position:relative}
label.btn:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.pick{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:0;cursor:pointer;font-size:0;z-index:1}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.opt-pick:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.link{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:500 15px/1.2 var(--font-body);cursor:pointer;min-height:40px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-2);padding:4px;border-radius:14px}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink);border-radius:10px;min-height:40px;font:600 14px/1.2 var(--font-body);cursor:pointer;padding:6px 8px}
.seg button.on{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12);color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:14px;font-weight:700;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=password],select,textarea{width:100%;min-width:0;padding:12px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);color:var(--ink);font:16px/1.3 var(--font-body)}
textarea{min-height:88px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.check{display:flex;gap:12px;align-items:flex-start;font-size:15px;cursor:pointer}
.check input{width:22px;height:22px;flex:0 0 22px;margin:1px 0 0;accent-color:var(--accent)}
.opt-pick{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:14px;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:4px;width:100%}
.opt-pick.on{border-color:var(--accent);background:var(--accent-soft)}
.opt-pick strong{font-size:16px}
.note{border-radius:var(--r-s);padding:12px 14px;font-size:15px;display:flex;gap:10px;align-items:flex-start}
.note.info{background:var(--surface-2)}
.note.warn{background:var(--ochre-soft)}
.note.danger{background:var(--danger-soft)}
.note .ic{flex:0 0 20px;height:20px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px}
.note.info .ic{background:var(--line);color:var(--ink)}
.note.warn .ic{background:var(--ochre);color:var(--surface)}
.note.danger .ic{background:var(--danger);color:var(--surface)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.emo{background:var(--warm-soft);color:var(--warm)}
.badge.ai{background:var(--surface-2);color:var(--muted);letter-spacing:.02em}
.badge.eq{background:var(--sage-soft);color:var(--sage)}
.badge.co{background:var(--ochre-soft);color:var(--ochre)}
.badge.pl{background:var(--warm-soft);color:var(--warm)}
.progress{font-size:13px;color:var(--muted);font-weight:600}
.dots{display:flex;gap:6px}
.dots i{width:24px;height:4px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--accent)}
/* Today */
.budget{display:flex;flex-direction:column;gap:12px}
.budget-big{font-family:var(--font-display);font-weight:800;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.budget-big small{font-family:var(--font-body);font-size:16px;color:var(--muted);margin-left:6px}
.bar{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sage);border-radius:6px}
.bar.over>i{background:var(--warm-bar)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv b{font-size:17px;font-variant-numeric:tabular-nums}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.macro{background:var(--surface-2);border-radius:var(--r-s);padding:10px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.macro b{font-size:17px;font-variant-numeric:tabular-nums}
.macro span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.macro.sugar{background:var(--warm-soft)}
.macro.sugar b{color:var(--warm)}
.cta{display:grid;grid-template-columns:1fr;gap:10px}
.list{display:flex;flex-direction:column}
.item{border-top:1px solid var(--line);padding-block:12px;display:flex;flex-direction:column;gap:8px}
.item:first-child{border-top:0;padding-top:0}
.item:last-child{padding-bottom:0}
.item-head{appearance:none;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;width:100%}
.item-time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px;min-width:40px}
.item-name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item-kcal{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.coach{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.coach p{font-size:17px}
.coach.strict{border-left:0}
.food{display:grid;grid-template-columns:1fr 92px auto;gap:10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.food:first-child{border-top:0}
.food .nm{min-width:0;overflow-wrap:anywhere}
.food input{padding:8px;text-align:right}
.food .kc{font-variant-numeric:tabular-nums;min-width:62px;text-align:right;font-weight:600}
.x{appearance:none;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:4px 6px;border-radius:8px}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.total .range{font-family:var(--font-display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums}
.photo-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);border-radius:var(--r);background:var(--surface);min-height:150px;padding:16px;cursor:pointer;text-align:center;color:var(--muted)}
.photo-drop{position:relative}
.photo-drop input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;font-size:0;z-index:1}
.photo-drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.photo-drop .plus{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:26px;font-weight:600}
.preview{width:100%;max-height:260px;object-fit:cover;border-radius:var(--r);display:block}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;min-height:46px;font:700 17px/1 var(--font-body);cursor:pointer}
.scale button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ends{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}
.ends span{max-width:48%}
.ends span:last-child{text-align:right}
.scale.s6{grid-template-columns:repeat(6,1fr)}
.opt{display:flex;flex-direction:column;gap:12px}
.opt ul,.opt ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.opt-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.opt-meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--accent);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}}
.loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:28px;text-align:center}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 10px;font:600 11px/1.1 var(--font-body);cursor:pointer;min-height:58px}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.tab.add .ring{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-4px}
.tab.add .ring svg{width:20px;height:20px;stroke-width:2.4}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(10,15,11,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.chart{width:100%;height:auto;display:block}
.chart .b-ok{fill:var(--sage)} .chart .b-over{fill:var(--warm-bar)} .chart .b-sugar{fill:var(--warm-bar)}
.chart .ref{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3}
.chart .lbl{fill:var(--muted);font:600 10px var(--font-body)}
.chart .val{fill:var(--ink);font:600 10px var(--font-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .line{stroke:var(--accent);stroke-width:2.5;fill:none}
.chart .pt{fill:var(--accent)}
.chart .area{fill:var(--accent-soft)}
.recap{display:flex;flex-direction:column;gap:6px;font-size:14px}
.recap div{display:flex;justify-content:space-between;gap:8px}
details summary{cursor:pointer;font-weight:600}
.hr{height:1px;background:var(--line);border:0;margin:0}
.split{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.split-c{background:var(--surface-2);border-radius:var(--r-s);padding:10px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.split-c b{font-size:17px}
.split-c .over{color:var(--warm);font-weight:700}
@media (max-width:360px){.split{grid-template-columns:repeat(2,1fr)}}
.tbl{width:100%;min-width:520px;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
.tbl tr:last-child td{border-bottom:0}
.tbl td.hi{color:var(--warm);font-weight:700}
.sw{display:inline-flex;align-items:center}
.sw i{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);margin-left:-7px;box-shadow:0 0 0 1px var(--line)}
.sw i:first-child{margin-left:0}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.acc h2{font-size:18px}
.acc-h{appearance:none;background:none;border:0;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;min-height:60px;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.acc-h:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:var(--r)}
.acc-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.acc-s{font-family:var(--font-body);font-size:14px;font-weight:600;color:var(--muted);overflow-wrap:anywhere}
.chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px 0;flex:0 0 auto}
.acc.open .chev{transform:rotate(-135deg);margin:4px 4px 0 0}
.acc-b{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.acc-b>.card:not(.flat){border:0;padding:0;background:none;box-shadow:none;border-radius:0}
.tiles-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{position:relative;appearance:none;min-height:100px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);color:var(--ink);padding:10px;display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;font:inherit;min-width:0}
.tile .tl{font-size:12.5px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.tile .tv{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:auto}
.tile .th{font-size:12px;color:var(--muted);line-height:1.25}
.tile .ti{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:auto}
.tile.done{background:var(--sage-soft);border-color:transparent}
.tile.done .th{color:var(--ink)}
.tile.skip{background:var(--surface-2);border-color:transparent;color:var(--muted)}
.tile.extra{border-style:dashed}
.tile.wr .ti{stroke:var(--muted)}
label.tile:has(input:focus-visible),.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:370px){.tiles{grid-template-columns:repeat(2,1fr)}}
.hydro{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center}
.bottle{width:64px;height:128px;display:block}
.bottle .water{transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.hydro-n{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.drinks{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.drink{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;min-height:58px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 11.5px/1.1 var(--font-body);cursor:pointer}
.drink .em{font-size:22px;line-height:1}
.drink:active{transform:scale(.94)}
.drink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drink.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.12)}}
@media (prefers-reduced-motion: reduce){.bottle .water{transition:none}.drink.pop{animation:none}}
.tile.flash{animation:flash 1.2s ease 2}
@keyframes flash{50%{box-shadow:0 0 0 4px var(--accent)}}
.footer-note{font-size:12px;color:var(--muted);text-align:center;padding-top:8px}
@media (max-width:360px){.macros{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}}
@media (min-width:480px){.cta{grid-template-columns:1fr 1fr}}
</style>

function dayKey(d){ d = d || new Date(); const z = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth()+1) + '-' + z(d.getDate()); }
function keyToDate(k){ const p = k.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(k, n){ const d = keyToDate(k); d.setDate(d.getDate() + n); return dayKey(d); }

function fmtTime(iso){ try { return new Intl.DateTimeFormat(LOCALE[LANG], {hour:'2-digit', minute:'2-digit'}).format(new Date(iso)); } catch(e){ return ''; } }
function weekKey(d){ d = d || new Date(); const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const dn = x.getUTCDay() || 7; x.setUTCDate(x.getUTCDate() + 4 - dn); const y0 = new Date(Date.UTC(x.getUTCFullYear(), 0, 1)); const w = Math.ceil(((x - y0) / 86400000 + 1) / 7); return x.getUTCFullYear() + '-W' + String(w).padStart(2, '0'); }
function daysBetween(a, b){ return Math.round((keyToDate(b) - keyToDate(a)) / 86400000); }

/* Paths used by the app, mapped to tables: data/users/<id>/<key> -> kv ; coaching/<id> -> coaching ; feedback/<id> -> feedback */
function parsePath(p){
  const s = String(p).split('/');
  if (s[0] === 'data' && s[1] === 'users' && s.length >= 4) return {table:'kv', uid:s[2], key:s.slice(3).join('/')};
  if ((s[0] === 'coaching' || s[0] === 'feedback') && s.length === 2) return {table:s[0], uid:s[1]};
  throw new TypeError('path ' + p);
}
const DBA = {
  doc(path){ const P = parsePath(path); return {
    async get(){
      const q = P.table === 'kv' ? SB.from('kv').select('value').eq('user_id', P.uid).eq('key', P.key) : SB.from(P.table).select('data').eq('user_id', P.uid);
      const { data, error } = await q.maybeSingle(); if (error) throw sbErr(error);
      const v = data ? (P.table === 'kv' ? data.value : data.data) : undefined;
      return {exists:!!data, id:P.key || P.uid, data:() => v};
    },
    async set(v){
      const row = P.table === 'kv' ? {user_id:P.uid, key:P.key, value:v, updated_at:new Date().toISOString()} : {user_id:P.uid, data:v, updated_at:new Date().toISOString()};
      const { error } = await SB.from(P.table).upsert(row); if (error) throw sbErr(error);
    },
    async delete(){
      let q = SB.from(P.table).delete().eq('user_id', P.uid); if (P.table === 'kv') q = q.eq('key', P.key);
      const { error } = await q; if (error) throw sbErr(error);
    }
  }; },
  collection(path){
    const s = String(path).split('/');
    const fetchAll = async () => {
      if (s[0] === 'data'){ const { data, error } = await SB.from('kv').select('key').eq('user_id', s[2]); if (error) throw sbErr(error); return {docs:(data || []).map(r => ({id:r.key, data:() => null}))}; }
      const { data, error } = await SB.from(s[0]).select('user_id,data,updated_at'); if (error) throw sbErr(error);
      return {docs:(data || []).map(r => ({id:r.user_id, data:() => r.data}))};
    };
    return {
      get:fetchAll,
      onSnapshot(cb, onErr){
        let stop = false;
        const tick = () => fetchAll().then(sn => { if (!stop) cb(sn); }).catch(e => { if (!stop && onErr) onErr(e); });
        const vis = () => { if (document.visibilityState === 'visible') tick(); };
        tick(); const iv = setInterval(tick, 60000); document.addEventListener('visibilitychange', vis);
        return () => { stop = true; clearInterval(iv); document.removeEventListener('visibilitychange', vis); };
      }
    };
  }
};

function conflicts(allergens, contains){
  const R = activeR(); const A = new Set((allergens || []).map(s => String(s).toLowerCase())); const C = contains || {}; const out = [];
  for (const code in R){
    let hit = false;
    if (ALLERGENS.indexOf(code) >= 0) hit = A.has(code);
    else switch(code){
      case 'lactose': hit = A.has('lait'); break;
      case 'vegetarien': hit = !!(C.viande || C.poisson) || A.has('poissons') || A.has('crustaces') || A.has('mollusques'); break;
      case 'vegetalien': hit = !!(C.viande || C.poisson || C.produits_animaux) || A.has('oeufs') || A.has('lait') || A.has('poissons') || A.has('crustaces') || A.has('mollusques'); break;
      case 'pescetarien': hit = !!C.viande; break;
      case 'sans_gluten_choix': hit = A.has('gluten'); break;
      case 'sans_porc': hit = !!C.porc; break;
      case 'halal': hit = !!(C.porc || C.alcool); break;
      case 'casher': hit = !!C.porc || A.has('crustaces') || A.has('mollusques'); break;
      case 'sans_alcool': hit = !!C.alcool; break;
    }
    if (hit) out.push({code, level:R[code].level});
  }
  return out;
}

async function prepImage(file){
  if (!file) return null;
  const okTypes = ['image/jpeg','image/png','image/webp'];
  if (okTypes.indexOf(file.type) >= 0 && file.size < 4.5e6) return file;
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1600; const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth*sc); cv.height = Math.round(img.naturalHeight*sc);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    return await new Promise(res => cv.toBlob(b => res(b || file), 'image/jpeg', 0.85));
  } catch(e){ return file; }
}

function lineSVG(E){
  const W = 340, H = 170, L = 34, R = 10, Tp = 14, B = 24; const ws = E.map(e => num(e.weight)); let mn = Math.min(...ws), mx = Math.max(...ws); if (mx - mn < 2){ const c = (mx + mn) / 2; mn = c - 1; mx = c + 1; } mn = Math.floor(mn); mx = Math.ceil(mx);
  const x = i => E.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (E.length - 1); const y = v => Tp + (mx - v) / (mx - mn) * (H - Tp - B);
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  [mn, (mn + mx) / 2, mx].forEach(v => { s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/><text class="lbl" x="' + (L - 6) + '" y="' + (y(v) + 3).toFixed(1) + '" text-anchor="end">' + nf(v, v % 1 ? 1 : 0) + '</text>'; });
  const pts = E.map((e, i) => x(i).toFixed(1) + ',' + y(num(e.weight)).toFixed(1));
  if (E.length > 1) s += '<polygon class="area" points="' + x(0).toFixed(1) + ',' + (H - B) + ' ' + pts.join(' ') + ' ' + x(E.length - 1).toFixed(1) + ',' + (H - B) + '"/><polyline class="line" points="' + pts.join(' ') + '"/>';
  E.forEach((e, i) => { const last = i === E.length - 1; s += '<circle class="pt" cx="' + x(i).toFixed(1) + '" cy="' + y(num(e.weight)).toFixed(1) + '" r="' + (last ? 5 : 3) + '"/>'; if (last) s += '<text class="val" x="' + Math.min(x(i), W - R - 14).toFixed(1) + '" y="' + (y(num(e.weight)) - 9).toFixed(1) + '" text-anchor="middle">' + nf(num(e.weight), 1) + '</text>'; });
  s += '<text class="lbl" x="' + x(0).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="start">' + esc(fmtDay(E[0].date, {day:'numeric', month:'short'})) + '</text>';
  if (E.length > 1) s += '<text class="lbl" x="' + x(E.length - 1).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="end">' + esc(fmtDay(E[E.length - 1].date, {day:'numeric', month:'short'})) + '</text>';
  return s + '</svg>';
}

function lifeShort(L){

  parts.push(t('ls_sleep') + ' ' + L.sleepQ + '/5' + (L.sleepH ? ' (' + t('sh_' + L.sleepH) + ')' : ''));
  parts.push(t('ls_family') + ' ' + L.family + '/5');

  if ((L.cravings || []).length) parts.push(t('ls_crave') + ' : ' + L.cravings.map(x => t('cr_' + x)).join(', '));

}

function loadXLSX(){

  const one = src => new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = src; sc.onload = () => window.XLSX ? res(window.XLSX) : rej(new Error('xlsx')); sc.onerror = () => rej(new Error('xlsx')); document.head.appendChild(sc); });
  return one(srcs[0]).catch(() => one(srcs[1]));
}

  if (E.length >= 2){ const last = E[E.length - 1]; const ref = E.slice().reverse().find(e => daysBetween(e.date, last.date) >= 7); if (ref){ const wk = daysBetween(ref.date, last.date) / 7; if (wk > 0 && (num(ref.weight) - num(last.weight)) / wk > 1.2) rapid = true; } }
  let sk7 = 0, eveDef = 0; for (let i = 0; i < 7; i++){ const dd = dayRO(addDays(today, -i)); sk7 += (dd.skipped || []).length; if (dd.checkin && dd.checkin.deficit) eveDef++; }
  const signal = (tot >= 8 && emo / tot >= 0.5) || low >= 3 || rapid || sk7 >= 4 || eveDef >= 3;
  if (!signal) return;
  const shown = p.supportShownAt ? daysBetween(p.supportShownAt, today) : 999;
  if (shown >= 7){ S.showSupport = true; p.supportShownAt = today; p.softUntil = addDays(today, 14); Store.set('profile', p); }
}

/* ================= Démarrage ================= */
function resetUserState(){
  if (S.coachUnsub){ try { S.coachUnsub(); } catch(e){} }
  Object.assign(S, {loaded:true, view:'today', profile:null, days:{}, favorites:[], body:{entries:[]}, bilans:{weeks:{}}, sample:null, sampleReady:false, imgOk:false, isOwner:false,
    ob:null, add:null, idea:null, act:null, rd:null, rdDirty:false, hd:null, hdDirty:false, lifeDraft:null, dayDraft:null, setDraft:null, coachDraft:null, histOpen:null, histLoaded:false, histLoading:false,
    expanded:null, sheet:null, fbList:null, q:null, qLater:{}, showSupport:false, exportText:null, deleteAsk:false, coachData:null, coachUnsub:null, coachSel:null, coachErr:false, secOpen:{}, coachLater:false, pickFail:false, eve:null, eveLater:false});
}
function onSignedOut(){ if (S.auth && !Store.uid) return; Store.setSession(null); resetUserState(); S.auth = newAuth(); render(); window.scrollTo(0, 0); }
function newAuth(){ return {mode:'signup', email:'', pass:'', error:null, busy:false}; }
function viewCfg(){ return '<div class="stack" style="padding-top:8px"><h1>' + esc(t('app')) + '</h1><p class="muted">' + esc(t('ob_welcome')) + '</p>' + note('warn', esc(S.cfgMissing === 'net' ? t('err_generic') : t('cfg_missing'))) + (S.cfgMissing === 'cfg' ? '<div class="card stack-s"><p class="small">' + esc(t('demo_note')) + '</p><button class="btn primary big block" data-act="demo">' + esc(t('demo_btn')) + '</button></div>' : '') + '</div>'; }
async function startDemo(){ Store.startDemo(); S.cfgMissing = null; S.auth = null; S.loaded = false; render(); await loadUserData(); S.sample = null; S.imgOk = false; S.sampleReady = true; render(); }
function viewAuth(){
  const A = S.auth;
  return '<div class="stack" style="padding-top:8px"><h1>' + esc(t('app')) + '</h1><p class="muted">' + esc(t('ob_welcome')) + '</p>' +
    '<div class="grid2">' + Object.keys(LANG_NATIVE).map(l => '<button class="opt-pick ' + (LANG === l ? 'on' : '') + '" data-act="lang" data-v="' + l + '" aria-pressed="' + (LANG === l) + '"><strong>' + LANG_NATIVE[l] + '</strong></button>').join('') + '</div>' +
    '<div class="card stack">' + seg('auth-mode', 'auth.mode', A.mode, [['signup', t('au_signup')], ['login', t('au_login')]]) +
    '<label class="field"><span>' + esc(t('au_email')) + '</span><input type="email" inputmode="email" autocomplete="email" autocapitalize="off" id="au-email" data-f="auth.email" value="' + esc(A.email) + '"></label>' +
    '<label class="field"><span>' + esc(t('au_pass')) + '</span><input type="password" autocomplete="' + (A.mode === 'signup' ? 'new-password' : 'current-password') + '" id="au-pass" data-f="auth.pass" value="' + esc(A.pass) + '"></label>' +
    '<p class="tiny muted">' + esc(A.mode === 'signup' ? t('au_pass_hint') : t('au_forgot')) + '</p>' +
    (A.error ? note('danger', esc(A.error)) : '') +
    '<button class="btn primary big block" data-act="auth-go"' + (A.busy ? ' disabled' : '') + '>' + esc(A.busy ? t('loading') : (A.mode === 'signup' ? t('au_signup_btn') : t('au_login_btn'))) + '</button></div>' +
    note('info', esc(t('au_privacy'))) + '<p class="footer-note">' + esc(t('disclaimer')) + '</p></div>';
}
async function authGo(){
  const A = S.auth; if (!A || A.busy) return; A.error = null;
  const email = String(A.email || '').trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ A.error = t('au_bad_email'); render(); return; }
  if (String(A.pass || '').length < 8){ A.error = t('au_bad_pass'); render(); return; }
  A.busy = true; render();
  try {
    const res = A.mode === 'signup' ? await SB.auth.signUp({email, password:A.pass}) : await SB.auth.signInWithPassword({email, password:A.pass});
    if (res.error) throw res.error;
    if (!res.data || !res.data.session){ A.busy = false; A.error = t('au_confirm'); render(); return; }
    Store.setSession(res.data.session); resetUserState(); S.auth = null; S.loaded = false; render();
    await loadUserData();
  } catch(e){
    A.busy = false; const m = (e && e.message) || '';
    A.error = /already registered|already exists|user_already_exists/i.test(m) ? t('au_exists') : /invalid login|invalid credentials/i.test(m) ? t('au_wrong') : /password/i.test(m) ? t('au_bad_pass') : /email not confirmed/i.test(m) ? t('au_confirm') : t('err_generic');
    render();
  }
}
async function logout(){ if (Store.demo){ location.reload(); return; } await remUnsubscribe(); if (S.profile && S.profile.reminders){ S.profile.reminders.on = false; await Store.set('profile', S.profile); } try { await SB.auth.signOut(); } catch(e){} onSignedOut(); }
async function loadUserData(){
  S.profile = await Store.get('profile');
  if (S.profile && S.profile.lang && T[S.profile.lang]) LANG = S.profile.lang;
  if (S.profile && S.profile.amb && AMBS[S.profile.amb]) setAmb(S.profile.amb);
  const ks = []; for (let i = 0; i < 14; i++) ks.push(addDays(dayKey(), -i));
  const res = await Promise.all([Store.get('favorites'), Store.get('body'), Store.get('bilans')].concat(ks.map(k => Store.get('day-' + k))));
  S.favorites = (res[0] && res[0].items) || []; S.body = res[1] || {entries:[]}; if (!S.body.entries) S.body.entries = []; S.bilans = res[2] || {weeks:{}};
  S.days = {}; ks.forEach((k, i) => { if (res[3 + i]) S.days[k] = res[3 + i]; });
  if (Store.demo){ S.sample = null; S.imgOk = false; } else { S.sample = makeAI(); S.imgOk = true; } S.sampleReady = true; S.downloads = DL;
  S.loaded = true; S.auth = null;
  if (S.profile && S.profile.onboarded) S.sheet = 'intro';
  if (S.profile && S.profile.onboarded) checkSignals();
  render();
  Store.user.isOwner().then(v => { S.isOwner = !!v; render(); }).catch(() => {});
  scheduleSync();
  const q = new URLSearchParams(location.search); const sl = q.get('slot');
  if (sl && S.profile && S.profile.onboarded){ S.sheet = null; S.view = 'today'; S.flashSlot = sl; try { history.replaceState(null, '', location.pathname); } catch(e){} render(); }
  if (!Store.demo){ if (remPrefs().on) swReg(); remCheck(); }
}
async function boot(){
  const nl = (navigator.language || 'fr').slice(0, 2).toLowerCase(); LANG = T[nl] ? nl : 'fr';
  const sl = lsGet('ca_lang'); if (T[sl]) LANG = sl;
  try { const a = localStorage.getItem('ca_amb'); if (AMBS[a]) AMB = a; } catch(e){}
  applyAmb();
  render();
  await Store.init();
  if (Store.unconfigured){ S.loaded = true; S.cfgMissing = Store.unconfigured; render(); return; }
  if (!Store.uid){ S.loaded = true; S.auth = newAuth(); render(); return; }
  await loadUserData();
}
boot();
})();
