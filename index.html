au_forgot_btn:'Esqueceste a palavra-passe?', fp_t:'Palavra-passe esquecida', fp_d:'Indica o e-mail da tua conta: vais receber um link para escolher uma nova palavra-passe.', fp_go:'Receber o link', fp_sent:'Enviado! Se existir uma conta com este endereço, vais receber um e-mail dentro de alguns minutos (vê também no spam). Abre o link neste telemóvel.', fp_back:'Voltar ao início de sessão', fp_wait:'Demasiados pedidos seguidos. Espera alguns minutos e tenta de novo.', fp_expired:'Este link expirou ou já foi usado. Pede um novo link abaixo.', fp_help:'Não recebeste o e-mail? O teu coach também pode repor a tua palavra-passe.', rp_t:'Nova palavra-passe', rp_d:'Escolhe uma nova palavra-passe para a conta {e}.', rp_new:'Nova palavra-passe', rp_new2:'Confirma a nova palavra-passe', rp_go:'Guardar a nova palavra-passe', rp_mismatch:'As duas palavras-passe não são iguais.', rp_same:'Escolhe uma palavra-passe diferente da anterior.', rp_done:'Palavra-passe alterada.', m_ulcere:'Úlcera ou gastrite', m_reflux:'Refluxo ou azia', m_digestion_lente:'Digestão lenta, inchaço', m_sii:'Cólon irritável (SII)', hn_dig:'Problemas digestivos: depois de cada refeição, o teu coach assinala os alimentos muitas vezes mal tolerados e ajuda-te a aliviar o jantar, para digerir e dormir melhor. Cada pessoa reage de forma diferente: observa o que te faz bem. A aplicação não substitui o teu médico; em caso de dor forte, vómitos ou sangue, consulta rapidamente.', vw_t:'Legibilidade', vw_d:'Para ler com mais facilidade: aumenta o texto, reforça o contraste ou escolhe um fundo claro ou escuro. A definição fica guardada neste telemóvel.', vw_size:'Tamanho do texto', vw_s1:'Normal', vw_s2:'Grande', vw_s3:'Muito grande', vw_contrast:'Contraste reforçado', vw_tip:'Dica: o leitor de ecrã do teu telemóvel (TalkBack no Android, VoiceOver no iPhone) também pode ler a aplicação em voz alta.',
rights:'Todos os direitos reservados', terms_link:'Condições de utilização', au_terms:'Aceito as condições de utilização', au_terms_read:'Ler', au_need_terms:'Marca a caixa para aceitar as condições de utilização.', tm_t:'Condições de utilização', tm_date:'Versão de 14 de outubro de 2026', tm_intro:'O Coach Assiette é uma aplicação de acompanhamento nutricional criada por {o}. Ao criar uma conta, aceitas as condições abaixo.', tm_h1:'1. O que a aplicação faz', tm_p1:'Estima as calorias, os macronutrientes e os açúcares das tuas refeições a partir de fotos ou descrições, e dá-te conselhos de coaching. Estas estimativas são indicativas: a aplicação não substitui um médico, um nutricionista nem um alergologista.', tm_h2:'2. A tua conta', tm_p2:'A tua conta é pessoal: não a partilhes e guarda a tua palavra-passe só para ti. A aplicação destina-se a pessoas com 18 anos ou mais.', tm_h3:'3. Propriedade intelectual', tm_p3:'A aplicação (o código, o design, os textos, os questionários, o nome «Coach Assiette» e o logótipo) pertence a {o}. Todos os direitos reservados. É proibido copiá-la, reproduzi-la, modificá-la, revendê-la, disponibilizá-la a outras pessoas ou explorá-la comercialmente, no todo ou em parte, sem autorização escrita (artigos L.122-4 e L.335-2 do Código da Propriedade Intelectual francês).', tm_h4:'4. Os teus dados', tm_p4:'Os teus dados ficam guardados em servidores na Europa e nunca são vendidos. As fotos são enviadas a um serviço de inteligência artificial apenas para serem analisadas: a aplicação não as guarda. O teu coach só vê os teus resultados se aceitares, e podes retirar esse acordo a qualquer momento. Podes exportar ou apagar todos os teus dados, e a tua conta, nas Definições.', tm_h5:'5. Acesso oferecido ou subscrição', tm_p5:'Conforme o que o teu coach decidir, o teu acesso é oferecido ou sujeito a uma subscrição mensal. A subscrição é paga por cartão ou débito direto SEPA através da Stripe; o teu coach nunca vê os teus dados bancários. Podes cancelá-la a qualquer momento nas Definições: fica ativa até ao fim do período pago. Se um pagamento falhar, a análise das fotos e os conselhos da IA ficam em pausa; os teus dados continuam acessíveis.', tm_h6:'6. Alterações', tm_p6:'A aplicação pode evoluir, ser modificada ou terminar. Se estas condições mudarem de forma importante, ser-te-ão apresentadas de novo.', tm_h7:'7. Lei aplicável', tm_p7:'Estas condições regem-se pela lei francesa.', tm_accept:'Aceito', tm_gate:'Antes de continuar, lê e aceita as condições de utilização.', s_pay:'A minha subscrição', pay_t:'Subscrição', pay_d:'Para analisar as tuas refeições por foto e receber os conselhos da IA, é necessária uma subscrição mensal. Podes cancelá-la quando quiseres.', pay_price:'{p} por mês', pay_go:'Subscrever', pay_manage:'Gerir a minha subscrição (pagamento, cancelamento)', pay_secure:'Pagamento seguro pela Stripe, por cartão ou débito direto SEPA. O teu coach nunca vê os teus dados bancários.', pay_meanwhile:'Entretanto, podes continuar a registar as refeições à mão.', pay_ai_off:'A análise por IA está em pausa: a tua subscrição não está ativa. Podes registar a refeição à mão, ou subscrever em Definições > A minha subscrição.', pay_banner_t:'Análise das fotos em pausa', pay_banner_d:'A tua subscrição não está ativa. Podes continuar a registar as refeições à mão.', pay_see:'Ver a subscrição', pay_late_banner:'O teu último pagamento não foi concluído. Atualiza o meio de pagamento para manter a análise das fotos.', pay_s_free:'Oferecido', pay_s_active:'Ativa', pay_s_late:'Pagamento a regularizar', pay_s_none:'Por ativar', pay_s_proc:'Em validação', pay_free_d:'O teu coach oferece-te o acesso à aplicação: não tens nada a pagar.', pay_active_d:'Subscrição ativa. Próximo pagamento a {d}.', pay_active_end:'Subscrição cancelada: fica ativa até {d}.', pay_late_d:'O teu último pagamento não foi concluído. Atualiza o meio de pagamento nos próximos dias para manter a análise das fotos.', pay_late_off:'O teu pagamento não foi concluído: a análise das fotos está em pausa. Atualiza o meio de pagamento para a reativar.', pay_proc:'O teu pagamento está em validação (um débito direto SEPA pode demorar alguns dias). Já podes usar a aplicação.', pay_thanks:'Obrigado! A tua subscrição está ativa.', pay_pending:'Pagamento recebido: está em validação.', pay_cancelled:'Pagamento cancelado: nada foi cobrado.', pay_already:'Já tens uma subscrição ativa.', pay_not_ready:'O pagamento ainda não está disponível. Tenta mais tarde ou fala com o teu coach.', pay_price_loading:'A carregar o preço…', ct_follow:'Acompanhamento', ct_bill:'Subscrições', bill_t:'Subscrições pagas', bill_off_d:'Desativadas: todos usam a aplicação gratuitamente. Já podes escolher abaixo quem terá acesso oferecido e quem pagará.', bill_on_d:'Ativadas: as pessoas «Pago» precisam de uma subscrição em dia para a análise das fotos e os conselhos da IA.', bill_turn_on:'Ativar as subscrições', bill_turn_off:'Desativar as subscrições', bill_need_stripe:'Ativa apenas quando a tua conta Stripe estiver ligada à aplicação.', bill_confirm_on:'Ativar as subscrições? As pessoas «Pago» sem subscrição deixam de poder analisar fotos (podem continuar a registar refeições à mão).', bill_confirm_yes:'Sim, ativar', bill_default_t:'Novas contas', bill_default_d:'Regra aplicada a quem não configuraste individualmente.', bill_free:'Oferecido', bill_paid:'Pago', bill_add_t:'Configurar uma pessoa por e-mail', bill_add_d:'Funciona mesmo antes de a pessoa criar a conta, por exemplo para oferecer o acesso à tua família.', bill_set_free:'Oferecer o acesso', bill_set_paid:'Tornar pago', bill_list_t:'Todas as contas', bill_sum:'{a} subscritor(es) em dia · {f} acesso(s) oferecido(s) · {n} conta(s)', bill_me:'Tu (coach)', bill_invited:'Ainda não inscrito', bill_st_active:'Subscritor', bill_st_late:'Pagamento em atraso', bill_st_none:'Sem subscrição', bill_st_free:'Oferecido', bill_by_default:'Segue a regra «Novas contas»', bill_next:'Próximo pagamento a { gd_t:'Guia da aplicação', gd_sub:'Os menus e o essencial, num minuto.', gd_welcome:'Bem-vindo! Aqui está o essencial num minuto. Podes voltar aqui a qualquer momento.', gd_link:'Como funciona? (guia de 1 minuto)', gd_open:'Descobrir o guia da aplicação', gd_start:'Vamos lá', gd_print:'Imprimir ou guardar em PDF', gd_find:'No topo do ecrã: o botão «?» reabre este guia a qualquer momento (também está nas Definições), e o botão «Aa» aumenta o texto, reforça o contraste ou muda para fundo claro ou escuro.', gd_h1:'O princípio', gd_p1:'Tiras fotos às tuas refeições: a aplicação estima as calorias, os açúcares e os macronutrientes.|Depois de cada refeição, o teu coach IA responde-te, em estilo Rigoroso ou Compreensivo.|O teu coach só vê os teus resultados se aceitares.|Os números são estimativas: uma referência, não uma medição ao grama.', gd_h2:'Os 5 separadores no fundo do ecrã', gd_p2:'Hoje: o teu dia num relance.|Adicionar (+): registar uma refeição.|Ideias: quando não sabes o que comer.|Evolução: a tua semana, o teu corpo, o teu histórico.|Definições: o teu perfil e todas as opções.', gd_h3:'O ecrã Hoje', gd_p3:'No topo: o que ainda podes comer hoje, com proteínas, hidratos, gorduras e açúcares.|As minhas refeições de hoje: 6 quadrados (pequeno-almoço, lanche das 10 h, almoço, lanche das 16 h, jantar, fora das refeições). Uma foto por quadrado e por dia; podes sempre escrever uma refeição a mais.|A minha garrafa: um toque = um copo (água, café ou chá, sumo, refrigerante, álcool).|Por fazer: pequenos passos sugeridos (partilha com o teu coach, lembretes…).|Atividades: adiciona o teu desporto, soma-se ao que podes comer.|À noite: o teu balanço da noite em poucos segundos.|O teu balanço inicial: balanço físico, perfil alimentar e personalidade, quando quiseres.', gd_h4:'Registar uma refeição', gd_p4:'Toca num quadrado de refeição: a câmara abre-se, tira a foto da refeição. Já tiraste a foto? «Escolher da galeria», por baixo dos quadrados.|Indica a tua fome (de 1 a 5) e se é física ou emocional.|Toca em «Analisar a minha refeição», corrige as porções se for preciso e depois em «Confirmar esta refeição».|Sem foto: «Escrever ou ditar», ou «Favoritos · como ontem».', gd_h5:'Ideias', gd_p5:'Tira uma foto ao frigorífico, à despensa, a uma montra ou a um menu, ou escreve o que tens à mão.|Indica o teu tempo e o teu equipamento (micro-ondas, placa, forno: podes escolher vários).|A aplicação propõe 3 ideias: equilibrada, meio-termo e prazer, cada uma com os ingredientes e a preparação.', gd_h6:'Evolução', gd_p6:'Semana: o teu balanço identifica os teus hábitos e propõe um objetivo simples.|Corpo: o teu peso, as tuas medidas e, se a ativares, a pesagem da manhã.|Histórico: os teus dias anteriores.|Balanço físico e fotos: massa gorda estimada, objetivo de cintura e, se quiseres, fotos de progresso.', gd_h7:'Definições', gd_p7:'Idioma (francês, inglês, português, espanhol ou árabe), ambiente (cores), legibilidade (tamanho do texto, contraste, fundo claro ou escuro) e estilo de coaching.|Modo férias: o teu coach adapta os conselhos durante as férias, sem pressão sobre o peso.|Perfil, dia típico, stress, saúde (incluindo problemas digestivos: úlcera, refluxo, digestão lenta, cólon irritável), alergias: atualiza-os se a tua vida mudar.|Acompanhamento pelo meu coach: ativar ou parar a partilha.|Pesagem da manhã, lembretes e subscrição se o teu coach a tiver ativado.|Os meus dados: exportar tudo ou apagar tudo.|Os meus perfis: perfil alimentar e personalidade, para o teu coach adaptar os conselhos.', gd_h8:'Bom saber', gd_p8:'Os teus dados são privados e ficam guardados em servidores na Europa.|Para a teres como uma verdadeira aplicação: toca em «📲 Instalar a aplicação» (ecrã de início de sessão, Hoje ou Definições). No Android basta um toque; no iPhone, a aplicação mostra-te os 3 gestos.|Esqueceste a palavra-passe? No ecrã de início de sessão, toca em «Esqueceste a palavra-passe?»: recebes um link por e-mail para escolher uma nova.|Uma pergunta? Fala com o teu coach, ou escreve em «A tua opinião» nas Definições.',
wg_meas_hint:'A tua pesagem da manhã regista-se acima. Aqui podes acrescentar as tuas medidas: uma vez por semana chega.',
wg_s:'Pesagem da manhã (opcional)', wg_t:'Pesagem da manhã', wg_intro:'Uma pesagem todas as manhãs, nas mesmas condições, para acompanhar a tua tendência ao longo da semana e do mês. É opcional e podes parar quando quiseres.', wg_time:'Peso-me por volta das', wg_cond_t:'Para que as tuas pesagens sejam comparáveis de um dia para o outro, comprometo-me a pesar-me:', wg_c_wake:'De manhã, ao acordar, depois de ir à casa de banho', wg_c_fast:'Em jejum, antes de beber ou comer', wg_c_outfit:'Sempre com a mesma roupa, a mais leve possível (por exemplo, mesmo antes de te vestires)', wg_c_scale:'Na mesma balança, no mesmo sítio, num chão firme', wg_need_all:'Marca as 4 condições para ativar a pesagem da manhã.', wg_share:'As tuas pesagens só são visíveis para o teu coach se a partilha com o teu coach estiver ativada.', wg_enable:'Ativar a pesagem da manhã', wg_disable:'Parar a pesagem da manhã', wg_on_toast:'Pesagem da manhã ativada.', wg_off_toast:'Pesagem da manhã parada.', wg_time_saved:'Hora guardada.', wg_blocked:'Com o que indicaste em «A minha saúde», a pesagem diária não é proposta: é desaconselhada sem a opinião de um profissional. Fala com o teu coach ou com o teu médico.', wg_sub_on:'Ativada · {h}', wg_today_t:'Pesagem da manhã', wg_today_d:'Se quiseres, é o momento de te pesares. É apenas uma referência.', wg_go:'Pesar-me', wg_edit:'Alterar', wg_skip:'Hoje não', wg_rem_t:'Um número indicativo, não um objetivo', wg_rem_p1:'O teu peso varia naturalmente de um dia para o outro: de algumas centenas de gramas até 1 a 2 kg em poucos dias, sem qualquer alteração da tua massa gorda. O número do dia é apenas uma referência: o que conta é a tendência ao longo de uma semana ou de um mês.', wg_rem_why:'O que faz variar o peso do dia:', wg_f_water:'A água e as refeições: tudo o que bebes e comes pesa (1 litro de água = 1 kg) até o teu corpo o eliminar.', wg_f_salt:'O sal: uma refeição salgada faz reter água durante algum tempo.', wg_f_carbs:'Os hidratos de carbono: o corpo armazena-os com água (cerca de 3 g de água por grama). Uma refeição rica em amidos pode fazer subir a balança sem ganho de gordura.', wg_f_heat:'O calor e o desporto: ao transpirar, perdes água; o peso volta a subir quando bebes.', wg_f_stress:'O stress e a falta de sono: podem influenciar a retenção de água e o apetite.', wg_f_cycle:'O ciclo menstrual: cerca de +0,5 kg em média durante a menstruação, por vezes mais.', wg_f_transit:'O trânsito intestinal: o que ainda está no intestino também conta na balança.', wg_f_week:'O fim de semana: o peso sobe em média cerca de 0,35 % e volta a descer durante a semana.', wg_weight:'Peso (kg)', wg_at:'Hora da pesagem', wg_check_t:'Esta manhã, pesei-me:', wg_check_hint:'Se uma condição não for cumprida, a pesagem fica registada mas não conta para a tua tendência.', wg_save:'Guardar a minha pesagem', wg_need_w:'Indica o teu peso em kg (por exemplo 72,5).', wg_saved:'Pesagem guardada.', wg_saved_off:'Pesagem guardada fora das condições: não conta para a tua tendência.', wg_trend:'Tendência em 7 dias', wg_evol:'{d} kg em 2 semanas', wg_evol_same:'Estável em 2 semanas', wg_trend_wait:'A tua tendência aparece depois de 3 pesagens nas condições em 7 dias.', wg_reg:'{n} pesagem(ns) nos últimos 7 dias, {k} nas condições', wg_alert:'A tua tendência está a descer depressa: mais de 1 kg por semana há 3 semanas. Uma perda demasiado rápida não é desejável: fala com o teu coach ou com o teu médico.', wg_offcond:'fora das condições', wg_promo_t:'Pesagem da manhã (opcional)', wg_promo_d:'Uma pesagem todas as manhãs nas mesmas condições para acompanhar a tua tendência na semana e no mês.', wg_rem_notif:'Lembrete de pesagem às {h}', wg_chart_legend:'Pontos: pesagens da manhã (círculos vazios = fora das condições) · Linha: média em 7 dias', wg_yes:'Sim', wg_no:'Não', coach_weigh:'Pesagem da manhã ({h}): tendência {w} · {e} em 2 semanas · {n}/7 pesagens, {k} nas condições', coach_weigh_alert:'Perda rápida: mais de 1 kg por semana há 3 semanas.', coa bil_t:'Tu balance inicial', bil_d:'Tres pequeños balances para que tu coach te conozca mejor y adapte sus consejos. Hazlos cuando quieras.', bil_phys:'Balance físico', bil_phys_d:'Medidas, grasa corporal estimada, objetivo de cintura', bil_food:'Mi perfil alimentario', bil_food_d:'Emociones, antojos, control, relación con la báscula', bil_perso:'Mi personalidad', bil_perso_d:'Tus grandes tendencias, para un coaching a tu medida', bil_min:'{m} min', bil_start:'Empezar', bil_done:'Hecho', bil_back:'Volver', bil_finish:'Terminar', bil_redo:'Repetir', bil_erase:'Borrar', bil_erased:'Perfil borrado.', bil_share:'Mostrar este perfil a mi coach', bil_general:'Son grandes tendencias generales, no un diagnóstico. Puedes repetir o borrar este test cuando quieras.', bil_answer_all:'Responde a todas las preguntas.', bp_intro:'Coge una cinta métrica (o un cordel y una regla). Mídete por la mañana, antes de comer, sin apretar la cinta, respirando con normalidad y sin meter tripa.', bp_how_waist:'Cintura: a medio camino entre la última costilla y la parte alta de la cadera (a menudo a la altura del ombligo).', bp_how_neck:'Cuello: justo debajo de la nuez, con la cinta ligeramente inclinada hacia delante.', bp_how_hips:'Cadera: en la parte más ancha de los glúteos.', neck:'Cuello', bp_opt:'opcional', bp_need:'Indica tu peso, tu cintura y tu cuello.', bp_need_f:'Indica tu peso y tus medidas de cintura, cuello y cadera.', bp_see:'Ver mi balance', bp_res_t:'Tu balance físico', bp_fat:'Grasa corporal estimada', bp_fat_range:'Rango probable: del {a} al {b} %', bp_fat_note:'Cálculo a partir de tus medidas con cinta (método de la Marina estadounidense). Es una referencia, no una medición exacta.', bp_no_fat:'La estimación de la grasa corporal necesita la cintura, el cuello y tu estatura (en tu perfil).', bp_rth:'Cintura / estatura', bp_zone_ok:'Zona favorable', bp_zone_mid:'Por encima de la zona favorable', bp_zone_high:'Muy por encima', bp_rth_d:'Una referencia reconocida para la grasa abdominal: lo ideal es que la cintura quede por debajo de la mitad de la estatura.', bp_target:'Tu objetivo de salud: una cintura por debajo de {t} cm.', bp_target_short:'Objetivo de cintura', bp_margin:'Tu margen de progreso: unos {d} cm, a tu ritmo.', bp_in_zone:'Ya estás en la zona favorable: el objetivo es mantenerte en ella y sentirte bien.', bp_slow:'El cuerpo cambia despacio, y las medidas varían de un día a otro según las comidas, el estrés o la digestión. Repite este balance dentro de 4 semanas, en las mismas condiciones.', bp_soft:'Tus medidas están guardadas. Aquí nos fijamos sobre todo en tu bienestar y tus hábitos, sin cifra de grasa corporal.', bp_last:'Último balance: {d}', bp_new:'Nuevo balance físico', bp_none:'Haz tu balance físico: bastan unas medidas con cinta.', bp_due_t:'Tu balance del mes', bp_due_d:'Han pasado 4 semanas: vuelve a medirte para ver el camino recorrido.', ph_t:'Fotos de progreso', ph_intro:'Una foto de frente y otra de perfil, más o menos una vez al mes, para ver tu evolución. Es opcional: tú decides.', ph_how_t:'Para fotos comparables', ph_how:'Mismo sitio, misma luz, por la mañana antes de comer.|Ropa ajustada o ropa interior, siempre la misma.|Móvil a la altura del pecho, a 2 o 3 metros (temporizador o alguien que te ayude).|De pie, en postura natural, brazos a lo largo del cuerpo, sin meter tripa.', ph_priv:'Tus fotos se guardan de forma segura en servidores en Europa. Nadie las ve salvo tú, y tu coach si así lo decides. La IA nunca las analiza y puedes borrarlas en cualquier momento.', ph_adult:'Solo para mayores de edad.', ph_accept:'Acepto, hacer mis fotos', ph_no:'No, gracias', ph_discover:'Saber más', ph_take_d:'Haz una foto de frente y otra de perfil. También puedes hacer solo una.', ph_front:'De frente', ph_side:'De perfil', ph_take:'Hacer la foto', ph_retake:'Repetir', ph_save:'Guardar mis fotos', ph_saved:'Fotos guardadas.', ph_need_one:'Añade al menos una foto.', ph_err:'No se han podido guardar las fotos. Inténtalo de nuevo en un momento.', ph_unavail:'Las fotos de progreso aún no están disponibles. Inténtalo más tarde.', ph_need_account:'Las fotos de progreso funcionan con una cuenta, en la aplicación en línea.', ph_done_t:'Guardado', ph_next:'Próximas fotos dentro de unas 4 semanas, en las mismas condiciones.', ph_last:'Últimas: {d}', ph_new:'Nuevas fotos', ph_compare:'Comparar', ph_del:'Borrar estas fotos', ph_del_q:'¿Borrar las fotos del {d}?', ph_deleted:'Fotos borradas.', ph_cmp_t:'Comparar mis fotos', ph_cmp_from:'Antes', ph_cmp_to:'Después', ph_cmp_wait:'Para comparar, hacen falta al menos 4 semanas entre dos sesiones: antes, las diferencias vienen sobre todo del agua, de la última comida o de la luz. Próxima comparación posible el {d}.', ph_cmp_need:'Hacen falta al menos dos sesiones de fotos para comparar.', ph_share:'Compartir mis fotos con mi coach', ph_share_on:'Tu coach puede ver tus fotos.', ph_share_off:'Solo tú puedes ver tus fotos.', ph_due_t:'¿Nuevas fotos?', ph_due_d:'Han pasado 4 semanas desde tus últimas fotos de progreso.', ph_reassure_t:'Para tener en cuenta', ph_r1:'Una foto es un instante: la luz, la hora, la última comida o el agua la hacen variar. Lo que cuenta es la tendencia a lo largo de varias semanas.', ph_r2:'El cuerpo cambia despacio, y es normal: varía un poco según lo que comes, la sal, el estrés, el sueño o las hormonas.', ph_r3:'No te juzgues por una sola foto. Compara mejor dentro de un mes, en las mismas condiciones.', ph_r4:'Los verdaderos progresos también se notan en otras cosas: energía, sueño, ropa más cómoda, ánimo.', ph_r5:'Tener la tripa algo hinchada algunos días es normal (comida salada, digestión, estrés): se pasa en uno o dos días.', ph_r6:'Lo haces por ti, no por una imagen perfecta. Dedicarte este momento ya es avanzar.', ph_r7:'De un día a otro, las fotos y la báscula suben y bajan: solo la tendencia a lo largo de 4 a 8 semanas tiene sentido.', ph_r8:'Háblate como le hablarías a alguien a quien quieres: mira lo que avanza, no solo lo que falta.', ef_d:'Responde de forma espontánea: no hay respuestas buenas ni malas.', ef_lo:'Nunca', ef_hi:'Muy a menudo', ef_q_emo1:'Cuando tengo estrés, tristeza o cansancio, me apetece comer.', ef_q_emo2:'Como para reconfortarme o darme un capricho después de un día difícil.', ef_q_ext1:'Cuando veo o huelo algo rico, lo como aunque no tenga hambre.', ef_q_ext2:'Como más delante de una pantalla o cuando estoy con otras personas.', ef_q_res1:'Me contengo al comer para controlar mi peso.', ef_q_res2:'Después de un periodo de privación, acabo cayendo.', ef_q_img1:'Mi peso o mi aspecto influyen mucho en mi ánimo.', ef_q_img2:'Me peso o me miro el cuerpo a menudo para comprobar.', ef_mot_q:'Hoy, en cuanto a mi alimentación…', ef_mot_think:'Me lo estoy planteando', ef_mot_ready:'Tengo ganas de cambiar', ef_mot_started:'Ya he empezado a cambiar', ef_mot_keep:'Quiero mantener mis buenos hábitos', ef_see:'Ver mi perfil', ef_res_t:'Tu perfil alimentario', ef_dim_emo:'Hambre emocional', ef_dim_ext:'Antojos ligados al entorno', ef_dim_res:'Control y restricción', ef_dim_img:'Peso e imagen corporal', lv_low:'Tendencia baja', lv_mid:'Tendencia media', lv_high:'Tendencia fuerte', ef_balanced:'Sin una tendencia marcada: tu relación con la comida parece bastante equilibrada. Tu coach te ayudará a mantener el rumbo.', ef_tip:'Idea:', ef_txt_emo:'A veces la comida sirve para calmar una emoción. Es muy habitual, y se puede trabajar.', ef_tip_emo:'Antes de comer, pregúntate «¿hambre o emoción?». Si es una emoción, prueba primero otra cosa: caminar, llamar a alguien, tomar un té.', ef_txt_ext:'Las ganas de comer suelen venir de lo que te rodea: la vista, el olor, una pantalla, un aperitivo.', ef_tip_ext:'Come en la mesa, sin pantallas, sírvete el plato de antemano y deja las tentaciones fuera de la vista.', ef_txt_res:'Controlas mucho lo que comes. Demasiada restricción suele llevar a caer.', ef_tip_res:'Comidas completas y regulares, ningún alimento prohibido y algo de flexibilidad: es lo que funciona a largo plazo.', ef_txt_img:'El peso y el aspecto pesan en tu ánimo.', ef_tip_img:'Fíjate también en otras señales de progreso (energía, sueño, ropa) y pésate menos a menudo.', ef_motr_think:'Te lo estás planteando: avanzamos paso a paso, sin presión.', ef_motr_ready:'Tienes ganas de cambiar: tu coach te propondrá pequeños objetivos concretos.', ef_motr_started:'Ya has empezado: enhorabuena, vamos a consolidar tus nuevos hábitos.', ef_motr_keep:'Quieres mantener tus buenos hábitos: tu coach te ayudará a cuidarlos.', ef_care:'Si comer o tu imagen te hacen sufrir, hablar con un profesional (médico, dietista, psicólogo) puede ayudarte de verdad.', pe_d:'Indica hasta qué punto cada frase se parece a ti.', pe_lo:'Nada', pe_hi:'Totalmente', pe_q_org1:'Me gusta seguir un plan preciso y organizado.', pe_q_org2:'A menudo hago las cosas en el último momento.', pe_q_sto1:'Me preocupo con facilidad.', pe_q_sto2:'Mantengo la calma en situaciones difíciles.', pe_q_nov1:'Me gusta descubrir nuevas recetas y nuevos sabores.', pe_q_nov2:'Prefiero mis costumbres y cambio pocas veces.', pe_q_soc1:'Compartir mis progresos con otros me motiva.', pe_q_soc2:'Prefiero avanzar por mi cuenta, sin hablar de ello.', pe_see:'Ver mis tendencias', pe_res_t:'Tus grandes tendencias', pe_dim_org:'Organización', pe_dim_sto:'Estrés', pe_dim_nov:'Curiosidad', pe_dim_soc:'Motivación', pe_org_a:'Le gusta un plan claro', pe_org_b:'Prefiere la flexibilidad', pe_sto_a:'Sensible al estrés', pe_sto_b:'Lleva bien el estrés', pe_nov_a:'Le gusta la novedad', pe_nov_b:'Le gustan sus costumbres', pe_soc_a:'Motivación al compartir', pe_soc_b:'Avanza con autonomía', pe_adapt_t:'Cómo se adapta tu coach', pe_ad_org_a:'Referencias precisas: horarios, raciones, menús tipo.', pe_ad_org_b:'Consejos flexibles, fáciles de encajar en tu día.', pe_ad_sto_a:'Un tono especialmente tranquilizador, sin presión.', pe_ad_sto_b:'Un tono más directo, al grano.', pe_ad_nov_a:'Ideas variadas y nuevas recetas.', pe_ad_nov_b:'Pequeños ajustes en tus platos de siempre.', pe_ad_soc_a:'Ánimos para compartir tus progresos.', pe_ad_soc_b:'Autonomía: avanzas a tu ritmo.', pe_ad_mid:'{x}: un equilibrio entre ambos.', pf_t:'Mis perfiles', cb_t:'Balance inicial', cb_rth:'cintura / estatura {v}', cb_target:'objetivo < {t} cm', cb_fat:'grasa ≈ {v} %', cb_photos_none:'Ninguna foto compartida.',
in_t:'Instalar la aplicación', in_d:'Añade Coach Assiette a tu pantalla de inicio: se abrirá como una aplicación de verdad, a pantalla completa.', in_btn:'Instalar la aplicación', in_first_ios:'En iPhone, instálala antes de registrarte: luego abrirás la aplicación desde su icono.', in_done:'¡Instalada! Encuentra Coach Assiette en tu pantalla de inicio.', in_ok:'La aplicación está instalada: la usas desde su icono.', in_sum_ok:'Instalada', in_sum_no:'Aún no instalada', in_ios_t:'En iPhone, en 3 pasos', in_ios_1:'Toca el botón Compartir (un cuadrado con una flecha hacia arriba): abajo en Safari o en su menú «⋯», arriba a la derecha en Chrome.', in_ios_2:'Desliza y elige «Añadir a pantalla de inicio». ¿No aparece? Abre primero este enlace en Safari.', in_ios_3:'Toca «Añadir»: el icono de Coach Assiette aparece en tu pantalla de inicio.', in_ios_after:'Después abre la aplicación desde ese icono (inicia sesión si te lo pide). En iPhone, los recordatorios de comidas solo funcionan desde la aplicación instalada.', in_and_t:'En Android, en 3 pasos', in_and_1:'Abre el menú del navegador: ⋮ arriba a la derecha en Chrome, ≡ abajo en Samsung Internet.', in_and_2:'Elige «Instalar aplicación» o «Añadir a pantalla de inicio». ¿No aparece? Elige primero «Abrir en Chrome».', in_and_3:'Confirma: el icono de Coach Assiette aparece en tu pantalla de inicio.', in_app_t:'Abre primero este enlace en tu navegador', in_app_d:'Estás en el navegador de otra aplicación (Instagram, Facebook…), que no permite instalar. Toca el menú ⋯ o ⋮, elige «Abrir en el navegador» (o «Abrir en Safari / Chrome») y vuelve a tocar «Instalar la aplicación».', in_pc:'En un ordenador, en Chrome o Edge: haz clic en el icono de instalación a la derecha de la barra de direcciones, o en «Instalar Coach Assiette» en el menú ⋮. En el móvil, abre el mismo enlace y toca «Instalar la aplicación».', in_did:'Hecho',
vac_t:'Modo vacaciones', vac_d:'En vacaciones el ritmo cambia: te mueves de otra forma, comes más a menudo fuera o en familia, a veces bebes más. Activa este modo para que tu coach adapte sus consejos, sin presión sobre el peso.', vac_from:'Del', vac_to:'Al (opcional)', vac_move:'En estas vacaciones, me muevo', vac_less:'Menos', vac_same:'Igual', vac_more:'Más', vac_move_hint:'«Menos» baja un poco tus necesidades estimadas, «Más» las sube un poco.', vac_pause_weigh:'Pausar el pesaje de la mañana durante las vacaciones', vac_on:'Activar el modo vacaciones', vac_off:'Terminar mis vacaciones', vac_on_toast:'Modo vacaciones activado. ¡Felices vacaciones!', vac_off_toast:'Modo vacaciones terminado.', vac_sum_on:'Activado hasta el {d}', vac_sum_open:'Activado', vac_today_d:'¡Disfruta! Tu coach adapta sus consejos: sin presión sobre el peso, el equilibrio se mira en la semana.', vac_until:'Hasta el {d}', vac_back_t:'¡Bienvenido de vuelta!', vac_back_d:'Tus vacaciones han terminado: tu coaching vuelve a su ritmo habitual. Si la báscula ha subido un poco, tranquilo: a menudo es en parte agua, que se va en las semanas siguientes.', vac_weigh_note:'En vacaciones el peso suele subir un poco (comidas más saladas, alcohol, otro ritmo). En parte es agua, que suele irse en las semanas siguientes a la vuelta.', vac_badge:'De vacaciones', vac_coach:'De vacaciones del {a} al {b}', vac_coach_open:'De vacaciones desde el {a}', vac_bad_dates:'La fecha de fin debe ser posterior a la de inicio.',

au_forgot_btn:'¿Olvidaste tu contraseña?', fp_t:'Contraseña olvidada', fp_d:'Indica el correo de tu cuenta: recibirás un enlace para elegir una nueva contraseña.', fp_go:'Recibir el enlace', fp_sent:'¡Enviado! Si existe una cuenta con esta dirección, te llegará un correo en unos minutos (mira también en spam). Abre el enlace en este teléfono.', fp_back:'Volver a iniciar sesión', fp_wait:'Demasiadas solicitudes seguidas. Espera unos minutos y vuelve a intentarlo.', fp_expired:'Este enlace ha caducado o ya se ha usado. Pide un nuevo enlace abajo.', fp_help:'¿No te llega el correo? Tu coach también puede restablecer tu contraseña.', rp_t:'Nueva contraseña', rp_d:'Elige una nueva contraseña para la cuenta {e}.', rp_new:'Nueva contraseña', rp_new2:'Confirma la nueva contraseña', rp_go:'Guardar mi nueva contraseña', rp_mismatch:'Las dos contraseñas no coinciden.', rp_same:'Elige una contraseña distinta de la anterior.', rp_done:'Contraseña cambiada.', m_ulcere:'Úlcera o gastritis', m_reflux:'Reflujo o ardor de estómago', m_digestion_lente:'Digestión lenta, hinchazón', m_sii:'Colon irritable (SII)', hn_dig:'Problemas digestivos: después de cada comida, tu coach te señala los alimentos que a menudo se toleran mal y te ayuda a aligerar la cena, para digerir y dormir mejor. Cada persona reacciona de forma distinta: observa lo que te sienta bien. La aplicación no sustituye a tu médico; si tienes dolor fuerte, vómitos o sangre, consulta rápidamente.', vw_t:'Legibilidad', vw_d:'Para leer con más facilidad: agranda el texto, refuerza el contraste o elige un fondo claro u oscuro. El ajuste se guarda en este teléfono.', vw_size:'Tamaño del texto', vw_s1:'Normal', vw_s2:'Grande', vw_s3:'Muy grande', vw_contrast:'Contraste reforzado', vw_tip:'Consejo: el lector de pantalla de tu teléfono (TalkBack en Android, VoiceOver en iPhone) también puede leer la aplicación en voz alta.',
rights:'Todos los derechos reservados', terms_link:'Condiciones de uso', au_terms:'Acepto las condiciones de uso', au_terms_read:'Leer', au_need_terms:'Marca la casilla para aceptar las condiciones de uso.', tm_t:'Condiciones de uso', tm_date:'Versión del 14 de octubre de 2026', tm_intro:'Coach Assiette es una aplicación de acompañamiento nutricional creada por {o}. Al crear una cuenta, aceptas las condiciones siguientes.', tm_h1:'1. Qué hace la aplicación', tm_p1:'Estima las calorías, los macronutrientes y los azúcares de tus comidas a partir de fotos o descripciones, y te da consejos de coaching. Estas estimaciones son orientativas: la aplicación no sustituye a un médico, un dietista ni un alergólogo.', tm_h2:'2. Tu cuenta', tm_p2:'Tu cuenta es personal: no la compartas y guarda tu contraseña para ti. La aplicación es para personas de 18 años o más.', tm_h3:'3. Propiedad intelectual', tm_p3:'La aplicación (su código, su diseño, sus textos, sus cuestionarios, su nombre «Coach Assiette» y su logotipo) pertenece a {o}. Todos los derechos reservados. Queda prohibido copiarla, reproducirla, modificarla, revenderla, ponerla a disposición de otras personas o explotarla comercialmente, total o parcialmente, sin autorización escrita (artículos L.122-4 y L.335-2 del Código de la Propiedad Intelectual francés).', tm_h4:'4. Tus datos', tm_p4:'Tus datos se guardan en servidores en Europa y nunca se venden. Las fotos se envían a un servicio de inteligencia artificial solo para analizarlas: la aplicación no las conserva. Tu coach solo ve tus resultados si lo aceptas, y puedes retirar ese acuerdo en cualquier momento. Puedes exportar o eliminar todos tus datos, y tu cuenta, desde Ajustes.', tm_h5:'5. Acceso gratuito o suscripción', tm_p5:'Según lo que decida tu coach, tu acceso es gratuito o requiere una suscripción mensual. La suscripción se paga con tarjeta o domiciliación SEPA a través de Stripe; tu coach nunca ve tus datos bancarios. Puedes cancelarla en cualquier momento desde Ajustes: sigue activa hasta el final del periodo pagado. Si un pago no se completa, el análisis de fotos y los consejos de la IA se pausan; tus datos siguen accesibles.', tm_h6:'6. Cambios', tm_p6:'La aplicación puede evolucionar, modificarse o cerrarse. Si estas condiciones cambian de forma importante, se te volverán a mostrar.', tm_h7:'7. Ley aplicable', tm_p7:'Estas condiciones se rigen por la ley francesa.', tm_accept:'Acepto', tm_gate:'Antes de continuar, lee y acepta las condiciones de uso.', s_pay:'Mi suscripción', pay_t:'Suscripción', pay_d:'Para analizar tus comidas con fotos y recibir los consejos de la IA, hace falta una suscripción mensual. Puedes cancelarla cuando quieras.', pay_price:'{p} al mes', pay_go:'Suscribirme', pay_manage:'Gestionar mi suscripción (pago, cancelación)', pay_secure:'Pago seguro con Stripe, con tarjeta o domiciliación SEPA. Tu coach nunca ve tus datos bancarios.', pay_meanwhile:'Mientras tanto, puedes seguir anotando tus comidas a mano.', pay_ai_off:'El análisis por IA está en pausa: tu suscripción no está activa. Puedes anotar tu comida a mano o suscribirte en Ajustes > Mi suscripción.', pay_banner_t:'Análisis de fotos en pausa', pay_banner_d:'Tu suscripción no está activa. Puedes seguir anotando tus comidas a mano.', pay_see:'Ver la suscripción', pay_late_banner:'Tu último pago no se ha completado. Actualiza tu método de pago para mantener el análisis de fotos.', pay_s_free:'Gratuito', pay_s_active:'Activa', pay_s_late:'Pago pendiente', pay_s_none:'Por activar', pay_s_proc:'En validación', pay_free_d:'Tu coach te ofrece el acceso a la aplicación: no tienes nada que pagar.', pay_active_d:'Suscripción activa. Próximo pago el {d}.', pay_active_end:'Suscripción cancelada: sigue activa hasta el {d}.', pay_late_d:'Tu último pago no se ha completado. Actualiza tu método de pago en los próximos días para mantener el análisis de fotos.', pay_late_off:'Tu pago no se ha completado: el análisis de fotos está en pausa. Actualiza tu método au_signup:'Crear mi cuenta', au_login:'Iniciar sesión', au_email:'Correo electrónico', au_pass:'Contraseña', au_pass_hint:'Al menos 8 caracteres. Guárdala bien: te permite recuperar tus datos en cualquier teléfono.', au_forgot:'¿Olvidaste la contraseña? Pide a tu coach que la restablezca.', au_signup_btn:'Crear mi cuenta', au_login_btn:'Iniciar sesión', au_privacy:'Tus datos se guardan en tu espacio privado, en servidores en Europa. Tu coach solo ve tus resultados si lo aceptas.', au_bad_email:'Correo electrónico no válido.', au_bad_pass:'La contraseña debe tener al menos 8 caracteres.', au_exists:'Ya existe una cuenta con este correo: elige «Iniciar sesión».', au_wrong:'Correo o contraseña incorrectos.', au_confirm:'Cuenta creada: confirma tu correo con el mensaje recibido y luego inicia sesión.', au_account:'Sesión iniciada con {e}', au_logout:'Cerrar sesión', au_delete_account:'Tu cuenta también se eliminará.', err_quota:'Has alcanzado el límite de análisis por IA de hoy. Todavía puedes añadir tus comidas a mano.', cfg_missing:'La aplicación aún no está configurada: falta la dirección de la base de datos.',
gd_t:'Guía de la aplicación', gd_sub:'Los menús y lo esencial, en un minuto.', gd_welcome:'¡Bienvenido! Aquí tienes lo esencial en un minuto. Puedes volver aquí cuando quieras.', gd_link:'¿Cómo funciona? (guía de 1 minuto)', gd_open:'Descubrir la guía de la aplicación', gd_start:'¡Vamos!', gd_print:'Imprimir o guardar en PDF', gd_find:'Arriba de la pantalla: el botón «?» vuelve a abrir esta guía en cualquier momento (también está en Ajustes), y el botón «Aa» agranda el texto, refuerza el contraste o cambia a fondo claro u oscuro.', gd_h1:'El principio', gd_p1:'Haces fotos de tus comidas: la aplicación estima las calorías, los azúcares y los macronutrientes.|Después de cada comida, tu coach IA te responde, en estilo Estricto o Comprensivo.|Tu coach solo ve tus resultados si lo aceptas.|Las cifras son estimaciones: una referencia, no una medida al gramo.', gd_h2:'Las 5 pestañas abajo de la pantalla', gd_p2:'Hoy: tu día de un vistazo.|Añadir (+): anotar una comida.|Ideas: cuando no sabes qué comer.|Progreso: tu semana, tu cuerpo, tu historial.|Ajustes: tu perfil y todas las opciones.', gd_h3:'La pantalla Hoy', gd_p3:'Arriba: lo que te queda por comer hoy, con proteínas, hidratos, grasas y azúcares.|Mis comidas de hoy: 6 casillas (desayuno, tentempié de las 10, comida, merienda de las 16, cena, fuera de las comidas). Una foto por casilla y por día; siempre puedes escribir una comida más.|Mi botella: un toque = un vaso (agua, café o té, zumo, refresco, alcohol).|Pendiente: pequeños pasos sugeridos (compartir con tu coach, recordatorios…).|Actividades: añade tu deporte, se suma a lo que puedes comer.|Por la noche: tu balance de la noche en unos segundos.|Tu balance inicial: balance físico, perfil alimentario y personalidad, cuando quieras.', gd_h4:'Anotar una comida', gd_p4:'Toca una casilla de comida: se abre la cámara, haz la foto de tu comida. ¿Ya la hiciste? «Elegir de la galería», debajo de las casillas.|Indica tu hambre (de 1 a 5) y si es física o emocional.|Toca «Analizar mi comida», corrige las porciones si hace falta y luego «Confirmar esta comida».|Sin foto: «Escribir o dictar», o «Favoritos · como ayer».', gd_h5:'Ideas', gd_p5:'Haz una foto de tu nevera, tu despensa, un escaparate o un menú, o escribe lo que tienes a mano.|Indica tu tiempo y tu equipo (microondas, placa, horno: puedes elegir varios).|La aplicación te propone 3 ideas: equilibrada, término medio y capricho, cada una con sus ingredientes y su preparación.', gd_h6:'Progreso', gd_p6:'Semana: tu balance detecta tus hábitos y te propone un objetivo sencillo.|Cuerpo: tu peso, tus medidas y, si lo activas, el pesaje de la mañana.|Historial: tus días anteriores.|Balance físico y fotos: grasa corporal estimada, objetivo de cintura y, si quieres, fotos de progreso.', gd_h7:'Ajustes', gd_p7:'Idioma (francés, inglés, portugués, español o árabe), ambiente (colores), legibilidad (tamaño del texto, contraste, fondo claro u oscuro) y estilo de coaching.|Modo vacaciones: tu coach adapta sus consejos durante tus vacaciones, sin presión sobre el peso.|Perfil, día tipo, estrés, salud (incluidos los problemas digestivos: úlcera, reflujo, digestión lenta, colon irritable), alergias: actualízalos si tu vida cambia.|Seguimiento de mi coach: activar o dejar de compartir.|Pesaje de la mañana, recordatorios y suscripción si tu coach la ha activado.|Mis datos: exportarlo todo o borrarlo todo.|Mis perfiles: perfil alimentario y personalidad, para que tu coach adapte sus consejos.', gd_h8:'Bueno saberlo', gd_p8:'Tus datos son privados y se guardan en servidores en Europa.|Para tenerla como una aplicación de verdad: toca «📲 Instalar la aplicación» (pantalla de inicio de sesión, Hoy o Ajustes). En Android basta un toque; en iPhone, la aplicación te muestra los 3 pasos.|¿Olvidaste tu contraseña? En la pantalla de inicio de sesión, toca «¿Olvidaste tu contraseña?»: recibirás un enlace por correo para elegir una nueva.|¿Una pregunta? Habla con tu coach, o escribe en «Tu opinión» en Ajustes.' wg_s:'Pesaje de la mañana (opcional)', wg_t:'Pesaje de la mañana', wg_intro:'Un pesaje cada mañana, en las mismas condiciones, para seguir tu tendencia a lo largo de la semana y del mes. Es opcional y puedes dejarlo cuando quieras.', wg_time:'Me peso hacia las', wg_cond_t:'Para que tus pesajes se puedan comparar de un día a otro, me comprometo a pesarme:', wg_c_wake:'Por la mañana, al despertar, después de ir al baño', wg_c_fast:'En ayunas, antes de beber o comer', wg_c_outfit:'Siempre con la misma ropa, la más ligera posible (por ejemplo, justo antes de vestirte)', wg_c_scale:'En la misma báscula, en el mismo sitio, sobre un suelo firme', wg_need_all:'Marca las 4 condiciones para activar el pesaje de la mañana.', wg_share:'Tus pesajes solo son visibles para tu coach si el seguimiento por tu coach está activado.', wg_enable:'Activar el pesaje de la mañana', wg_disable:'Dejar el pesaje de la mañana', wg_on_toast:'Pesaje de la mañana activado.', wg_off_toast:'Pesaje de la mañana desactivado.', wg_time_saved:'Hora guardada.', wg_blocked:'Con lo que has indicado en «Mi salud», el pesaje diario no se propone: no se recomienda sin la opinión de un profesional. Habla con tu coach o con tu médico.', wg_sub_on:'Activado · {h}', wg_today_t:'Pesaje de la mañana', wg_today_d:'Si quieres, es el momento de pesarte. Solo es una referencia.', wg_go:'Pesarme', wg_edit:'Modificar', wg_skip:'Hoy no', wg_rem_t:'Un número orientativo, no un objetivo', wg_rem_p1:'Tu peso varía de forma natural de un día a otro: desde unos cientos de gramos hasta 1 o 2 kg en pocos días, sin ningún cambio en tu grasa corporal. El número del día solo es una referencia: lo que cuenta es la tendencia a lo largo de una semana o de un mes.', wg_rem_why:'Lo que hace variar el peso del día:', wg_f_water:'El agua y las comidas: todo lo que bebes y comes pesa (1 litro de agua = 1 kg) hasta que tu cuerpo lo elimina.', wg_f_salt:'La sal: una comida salada hace retener agua durante un tiempo.', wg_f_carbs:'Los hidrato ar:{"need_style":"اختر أسلوب التدريب.","need_answer":"اختر إجابة.","age_min":"التطبيق مخصص للأشخاص الذين تبلغ أعمارهم 18 عامًا فأكثر.","rights":"جميع الحقوق محفوظة","terms_link":"شروط الاستخدام","au_terms":"أوافق على شروط الاستخدام","au_terms_read":"قراءة","au_need_terms":"ضع علامة في المربع للموافقة على شروط الاستخدام.","tm_t":"شروط الاستخدام","tm_date":"نسخة 14 أكتوبر 2026","tm_intro":"Coach Assiette تطبيق للمرافقة الغذائية أنشأه {o}. بإنشائك حسابًا، فإنك توافق على الشروط التالية.","tm_h1":"1. ما يفعله التطبيق","tm_p1":"يقدّر السعرات الحرارية والمغذيات الكبرى والسكريات في وجباتك انطلاقًا من الصور أو الأوصاف، ويقدّم لك نصائح تدريبية. هذه التقديرات استرشادية: التطبيق لا يغني عن الطبيب ولا عن أخصائي التغذية ولا عن أخصائي الحساسية.","tm_h2":"2. حسابك","tm_p2":"حسابك شخصي: لا تشاركه مع أحد واحتفظ بكلمة المرور لنفسك. التطبيق مخصص للأشخاص الذين تبلغ أعمارهم 18 عامًا فأكثر.","tm_h3":"3. الملكية الفكرية","tm_p3":"التطبيق (شيفرته وتصميمه ونصوصه واستبياناته واسمه «Coach Assiette» وشعاره) ملك لـ {o}. جميع الحقوق محفوظة. يُمنع نسخه أو إعادة إنتاجه أو تعديله أو إعادة بيعه أو إتاحته لأشخاص آخرين أو استغلاله تجاريًا، كليًا أو جزئيًا، دون موافقته الكتابية (المادتان L.122-4 وL.335-2 من قانون الملكية الفكرية الفرنسي).","tm_h4":"4. بياناتك","tm_p4":"تُحفظ بياناتك على خوادم في أوروبا ولا تُباع أبدًا. تُرسل الصور إلى خدمة ذكاء اصطناعي لتحليلها فقط: التطبيق لا يحتفظ بها. لا يرى مدربك نتائجك إلا إذا وافقت على ذلك، ويمكنك سحب هذه الموافقة في أي وقت. يمكنك تصدير جميع بياناتك أو حذفها، وحذف حسابك، من الإعدادات.","tm_h5":"5. وصول مجاني أو اشتراك","tm_p5":"حسب ما يقرره مدربك، يكون وصولك مجانيًا أو خاضعًا لاشتراك شهري. يُدفع الاشتراك بالبطاقة البنكية أو بالاقتطاع المباشر SEPA عبر Stripe؛ ولا يرى مدربك بياناتك البنكية أبدًا. يمكنك إلغاؤه في أي وقت من الإعدادات: يبقى ساريًا حتى نهاية الفترة المدفوعة. إذا لم تنجح عملية دفع، يتوقف تحليل الصور ونصائح الذكاء الاصطناعي مؤقتًا؛ وتبقى بياناتك متاحة.","tm_h6":"6. التغييرات","tm_p6":"قد يتطور التطبيق أو يُعدَّل أو يتوقف. إذا تغيرت هذه الشروط تغييرًا مهمًا، فستُعرض عليك من جديد.","tm_h7":"7. القانون المطبق","tm_p7":"تخضع هذه الشروط للقانون الفرنسي.","tm_accept":"أوافق","tm_gate":"قبل المتابعة، يُرجى قراءة شروط الاستخدام والموافقة عليها.","s_pay":"اشتراكي","pay_t":"الاشتراك","pay_d":"لتحليل وجباتك بالصور والحصول على نصائح الذكاء الاصطناعي، يلزم اشتراك شهري. يمكنك إلغاؤه متى شئت.","pay_price":"{p} شهريًا","pay_go":"اشترك","pay_manage":"إدارة اشتراكي (الدفع، الإلغاء)","pay_secure":"دفع آمن عبر Stripe، بالبطاقة البنكية أو بالاقتطاع المباشر SEPA. لا يرى مدربك بياناتك البنكية أبدًا.","pay_meanwhile":"في الأثناء، يمكنك مواصلة تسجيل وجباتك يدويًا.","pay_ai_off":"التحليل بالذكاء الاصطناعي متوقف مؤقتًا: اشتراكك غير نشط. يمكنك تسجيل وجبتك يدويًا، أو الاشتراك من الإعدادات > اشتراكي.","pay_banner_t":"تحليل الصور متوقف مؤقتًا","pay_banner_d":"اشتراكك غير نشط. يمكنك مواصلة تسجيل وجباتك يدويًا.","pay_see":"عرض الاشتراك","pay_late_banner":"لم تنجح عملية دفعك الأخيرة. حدّث وسيلة الدفع للإبقاء على تحليل الصور.","pay_s_free":"مجاني","pay_s_active":"نشط","pay_s_late":"دفعة يجب تسويتها","pay_s_none":"بانتظار التفعيل","pay_s_proc":"قيد التحقق","pay_free_d":"يقدّم لك مدربك الوصول إلى التطبيق مجانًا: لا شيء عليك دفعه.","pay_active_d":"الاشتراك نشط. الدفعة القادمة في {d}.","pay_active_end":"تم إلغاء الاشتراك: يبقى ساريًا حتى {d}.","pay_late_d":"لم تنجح عملية دفعك الأخيرة. حدّث وسيلة الدفع خلال الأيام القادمة للإبقاء على تحليل الصور.","pay_late_off":"لم تنجح عملية دفعك: تحليل الصور متوقف مؤقتًا. حدّث وسيلة الدفع لإعادة تفعيله.","pay_proc":"دفعتك قيد التحقق (قد يستغرق الاقتطاع المباشر SEPA بضعة أيام). يمكنك استخدام التطبيق من الآن.","pay_thanks":"شكرًا! اشتراكك نشط.","pay_pending":"تم استلام الدفعة: إنها قيد التحقق.","pay_cancelled":"تم إلغاء الدفع: لم يُقتطع أي مبلغ.","pay_already":"لديك اشتراك نشط بالفعل.","pay_not_ready":"الدفع غير متاح بعد. أعد المحاولة لاحقًا أو تحدّث مع مدربك.","pay_price_loading":"جارٍ تحميل السعر…","ct_follow":"المتابعة","ct_bill":"الاشتراكات","bill_t":"الاشتراكات المدفوعة","bill_off_d":"معطّلة: الجميع يستخدم التطبيق م em_off_toast":"تم تعطيل التذكيرات.","rem_need_account":"تعمل التذكيرات مع حساب، في التطبيق عبر الإنترنت.","rem_err_ios":"على الآيفون، أضف التطبيق أولًا إلى شاشتك الرئيسية (زر المشاركة، ثم «إضافة إلى الشاشة الرئيسية»)، وافتحه من هذه الأيقونة، ثم فعّل التذكيرات.","rem_err_denied":"الإشعارات محظورة لهذا الموقع. اسمح بها في إعدادات متصفحك، ثم أعد المحاولة.","rem_err_unsupported":"هذا المتصفح لا يدعم الإشعارات. جرّب Chrome (أندرويد) أو Safari (آيفون).","rem_err_other":"تعذّر تفعيل التذكيرات. أعد المحاولة بعد قليل.","rem_todo_t":"تذكير إذا نسيت صورة؟","rem_todo_d":"إشعار صغير في وقت الوجبات، فقط إذا لم يُسجَّل أي شيء. أنت من يختار الأوقات.","rem_todo_btn":"اختيار تذكيراتي","demo_btn":"التجربة في الوضع التجريبي","demo_note":"الوضع التجريبي: تبقى إجاباتك على هذا الجهاز والتحليل بالذكاء الاصطناعي معطّل (إدخال يدوي). مثالي لاكتشاف التطبيق.","demo_on":"الوضع التجريبي: لا يُرسل أي شيء عبر الإنترنت.","demo_quit":"الخروج من الوضع التجريبي","au_signup":"إنشاء حسابي","au_login":"تسجيل الدخول","au_email":"البريد الإلكتروني","au_pass":"كلمة المرور","au_pass_hint":"8 أحرف على الأقل. احتفظ بها جيدًا: فهي تتيح لك استرجاع بياناتك على أي هاتف.","au_forgot":"نسيت كلمة المرور؟ اطلب من مدربك إعادة تعيينها.","au_signup_btn":"إنشاء حسابي","au_login_btn":"تسجيل الدخول","au_privacy":"تُحفظ بياناتك في مساحتك الخاصة، على خوادم في أوروبا. لا يرى مدربك نتائجك إلا إذا وافقت على ذلك.","au_bad_email":"بريد إلكتروني غير صالح.","au_bad_pass":"يجب أن تتكون كلمة المرور من 8 أحرف على الأقل.","au_exists":"يوجد حساب بهذا البريد الإلكتروني بالفعل: اختر «تسجيل الدخول».","au_wrong":"البريد الإلكتروني أو كلمة المرور غير صحيحة.","au_confirm":"تم إنشاء الحساب: أكّد بريدك الإلكتروني عبر الرسالة التي وصلتك، ثم سجّل الدخول.","au_account":"متصل باسم {e}","au_logout":"تسجيل الخروج","au_delete_account":"سيُحذف حسابك أيضًا.","err_quota":"لقد بلغت الحد الأقصى لتحليلات الذكاء الاصطناعي لهذا اليوم. ما زال بإمكانك إضافة وجباتك يدويًا.","cfg_missing":"التطبيق غير مُعدّ بعد: عنوان قاعدة البيانات مفقود.","gd_t":"دليل التطبيق","gd_sub":"القوائم والأساسيات، في دقيقة واحدة.","gd_welcome":"مرحبًا! إليك الأساسيات في دقيقة واحدة. يمكنك العودة إلى هنا في أي وقت.","gd_link":"كيف يعمل التطبيق؟ (دليل في دقيقة واحدة)","gd_open":"اكتشف دليل التطبيق","gd_start":"لنبدأ","gd_print":"طباعة أو حفظ بصيغة PDF","gd_find":"أعلى الشاشة: زر «?» يعيد فتح هذا الدليل في أي وقت (وهو موجود أيضًا في الإعدادات)، وزر «Aa» يكبّر النص أو يعزّز التباين أو يغيّر الخلفية إلى فاتحة أو داكنة.","gd_h1":"المبدأ","gd_p1":"تصوّر وجباتك: يقدّر التطبيق السعرات الحرارية والسكريات والمغذيات الكبرى.|بعد كل وجبة، يردّ عليك مدربك الذكي بأسلوب صارم أو متفهّم.|لا يرى مدربك نتائجك إلا إذا وافقت على ذلك.|الأرقام تقديرات: مرجع تقريبي، وليست قياسًا دقيقًا بالغرام.","gd_h2":"التبويبات الخمسة أسفل الشاشة","gd_p2":"اليوم: يومك بنظرة واحدة.|إضافة (+): تسجيل وجبة.|فكرة وجبة: عندما لا تعرف ماذا تأكل.|المتابعة: أسبوعك وجسمك وسجلّك.|الإعدادات: ملفك الشخصي وجميع الخيارات.","gd_h3":"شاشة اليوم","gd_p3":"في الأعلى: ما تبقّى لك لتأكله اليوم، مع البروتينات والكربوهيدرات والدهون والسكريات.|وجبات اليوم: 6 خانات (الفطور، وجبة خفيفة الساعة 10، الغداء، وجبة خفيفة الساعة 16، العشاء، خارج الوجبات). صورة واحدة لكل خانة في اليوم؛ ويمكنك دائمًا كتابة وجبة إضافية.|قارورتي: لمسة واحدة = كوب واحد (ماء، قهوة أو شاي، عصير، مشروب غازي، كحول).|مهام: خطوات صغيرة مقترحة (المشاركة مع مدربك، التذكيرات…).|الأنشطة: أضف رياضتك، فتُضاف إلى ما يمكنك أكله.|في المساء: حصيلة المساء في بضع ثوانٍ.|تقييمك الأولي: التقييم الجسدي والملف الغذائي والشخصية، متى شئت.","gd_h4":"تسجيل وجبة","gd_p4":"المس خانة وجبة: تُفتح الكاميرا، التقط صورة وجبتك. التقطت الصورة مسبقًا؟ «اختيار من المعرض» أسفل الخانات.|حدّد مستوى جوعك (من 1 إلى 5) وهل هو جسدي أم عاطفي.|المس «تحليل وجبتي»، وصحّح الحصص إذا لزم الأمر، ثم «تأكيد هذه الوجبة».|بدون صورة: «الكتابة أو الإملاء»، أو «المفضلة · مثل الأمس».","gd_h5":"فكرة وجبة","gd_p5":"صوّر ثلاجتك أو خزانتك أو واجهة محل أو قائمة طعام، أو اكتب ما لديك في متناول يدك.|حدّد وقتك وأدواتك (ميكروويف، موقد طهي، فرن: يمكنك اختيار أكثر من خيار).|يقترح عليك التطبيق 3 أفكار: متوازنة، وسطية، وللمتعة، ولكل منها مكوّناتها وطريقة تحضيرها.","gd_h6":"المتابعة","gd_p6":"الأسبوع: تحدّد حصيلتك عاداتك وتقترح عليك هدفًا بسيطًا.|الجسم: وزنك وقياساتك، ووزن الصباح إذا فعّلته.|السجل: أيامك السابقة.|التقييم الجسدي والصور: نسبة الدهون التقديرية، هدف محيط الخصر، وصور التقدّم إن رغبت.","gd_h7":"الإعدادات","gd_p7":"اللغة (الفرنسية، الإنجليزية، البرتغالية، الإسبانية أو العربية)، والأجواء (الألوان)، وسهولة القراءة (حجم النص، التباين، الخلفية الفاتحة أو الداكنة)، وأسلوب التدريب.|وضع العطلة: يكيّف مدربك نصائحه خلال عطلتك، دون ضغط على الوزن.|الملف الشخصي، اليوم المعتاد، التوتر، الصحة (بما فيها اضطرابات الهضم: القرحة، الارتجاع، بطء الهضم، القولون العصبي)، الحساسية: حدّثها إذا تغيّرت حياتك.|متابعة مدربي: تفعيل المشاركة أو إيقافها.|وزن الصباح، والتذكيرات، والاشتراك إذا فعّله مدربك.|بياناتي: تصدير كل شيء أو حذف كل شيء.|ملفاتي: الملف الغذائي والشخصية، ليكيّف مدربك نصائحه.","gd_h8":"معلومات مفيدة","gd_p8":"بياناتك خاصة ومحفوظة على خوادم في أوروبا.|لتستخدمه كتطبيق حقيقي: المس «📲 تثبيت التطبيق» (شاشة تسجيل الدخول أو «اليوم» أو الإعدادات). على أندرويد تكفي لمسة واحدة؛ وعلى الآيفون يعرض لك التطبيق الخطوات الثلاث.|نسيت كلمة المرور؟ في شاشة تسجيل الدخول، المس «نسيت كلمة المرور؟»: ستتلقى رابطًا عبر البريد الإلكتروني لاختيار كلمة مرور جديدة.|لديك سؤال؟ اسأل مدربك، أو اكتب عبر «رأيك» في الإعدادات.","wg_meas_hint":"يُسجَّل وزن الصباح في الأعلى. هنا يمكنك إضافة قياساتك: مرة واحدة في الأسبوع تكفي.","wg_s":"وزن الصباح (اختياري)","wg_t":"وزن الصباح","wg_intro":"وزن واحد كل صباح، في الظروف نفسها، لمتابعة اتجاه وزنك على مدى الأسبوع والشهر. الأمر اختياري ويمكنك إيقافه متى شئت.","wg_time":"أزن نفسي حوالي الساعة","wg_cond_t":"لتكون أوزاني قابلة للمقارنة من يوم لآخر، ألتزم بأن أزن نفسي:","wg_c_wake":"في الصباح، عند الاستيقاظ، بعد دخول المرحاض","wg_c_fast":"على الريق، قبل الشرب أو الأكل","wg_c_outfit":"دائمًا باللباس نفسه، وبأخف ما يمكن (مثلًا قبل ارتداء ملابسك مباشرة)","wg_c_scale":"على الميزان نفسه، موضوعًا في المكان نفسه على أرضية صلبة","wg_need_all":"ضع علامة على الشروط الأربعة لتفعيل وزن الص function parsePath(p){

const DRINKS = {water:{ml:250, kcal:0, s:0, g:0, e:'💧'}, hot:{ml:150, kcal:0, s:0, g:0, e:'☕'}, juice:{ml:250, kcal:110, s:22, g:26, e:'🧃'}, soda:{ml:330, kcal:140, s:35, g:35, e:'🥤'}, alcohol:{ml:125, kcal:85, s:1, g:3, e:'🍷'}};
function drinkVals(dr){ const D = DRINKS[dr.type] || DRINKS.water; if (dr.meal) return {kcal:0, s:0, g:0}; const su = num(dr.sugar); return {kcal:D.kcal + su * 20, s:D.s + su * 5, g:D.g + su * 5}; }
function hydroOf(day){ let ml = 0, alc = 0, hot = 0, sweet = 0, sugar = 0; (day.drinks || []).forEach(dr => { const D = DRINKS[dr.type] || DRINKS.water; if (dr.type === 'alcohol') alc++; else ml += D.ml; if (dr.type === 'hot') hot++; if (dr.type === 'juice' || dr.type === 'soda') sweet++; sugar += drinkVals(dr).s; }); return {ml, alc, hot, sweet, sugar:Math.round(sugar)}; }

function itemVals(it){ const f = it.unit === 'portion' ? num(it.qty) : (it.base.grams ? num(it.grams) / it.base.grams : 1); return {kcal:it.base.kcal*f, p:it.base.p*f, g:it.base.g*f, s:it.base.s*f, l:it.base.l*f}; }

function conflicts(allergens, contains){
  const R = activeR(); const A = new Set((allergens || []).map(s => String(s).toLowerCase())); const C = contains || {}; const out = [];

      case 'vegetarien': hit = !!(C.viande || C.poisson) || A.has('poissons') || A.has('crustaces') || A.has('mollusques'); break;

      case 'pescetarien': hit = !!C.viande; break;

  if (okTypes.indexOf(file.type) >= 0 && file.size < 4.5e6) return file;
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1600; const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth*sc); cv.height = Math.round(img.naturalHeight*sc);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    return await new Promise(res => cv.toBlob(b => res(b || file), 'image/jpeg', 0.85));
  } catch(e){ return file; }
}

/* ================= Signaux préoccupants ================= */
function checkSignals(){
  const p = S.profile; if (!p) return; const today = dayKey();
  let emo = 0, tot = 0, low = 0;
  for (let i = 0; i < 14; i++){ const k = addDays(today, -i); const d = dayRO(k); const ms = d.meals || []; ms.forEach(m => { if (m.hunger && m.hunger.type){ tot++; if (m.hunger.type === 'EMOTIONNELLE') emo++; } }); if (i > 0 && ms.length >= 2 && dayTotals(d).kcal < 0.5 * dayNeeds(k)) low++; }

  if (weighPrefs().on && weighValid().length >= 6) rapid = weighRapid();

  if (!signal) return;
  const shown = p.supportShownAt ? daysBetween(p.supportShownAt, today) : 999;
  if (shown >= 7){ S.showSupport = true; p.supportShownAt = today; p.softUntil = addDays(today, 14); Store.set('profile', p); }

}
function onSignedOut(){ if (S.auth && !Store.uid) return; Store.setSession(null); resetUserState(); S.auth = newAuth(); render(); window.scrollTo(0, 0); }

    '<button class="btn outline block" data-act="guide-open">📖 ' + esc(t('gd_link')) + '</button>' + note('info', esc(t('au_privacy'))) + '<p class="footer-note">' + esc(t('disclaimer')) + '</p>' + copyLine() + '</div>';
}
async function authGo(){
  const A = S.auth; if (!A || A.busy) return; if (A.mode === 'forgot'){ fpGo(); return; } A.error = null;
  const email = String(A.email || '').trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ A.error = t('au_bad_email'); render(); return; }
  if (String(A.pass || '').length < 8){ A.error = t('au_bad_pass'); render(); return; }
  if (A.mode === 'signup' && !A.terms){ A.error = t('au_need_terms'); render(); return; }
  A.busy = true; render();
  try {
    const res = A.mode === 'signup' ? await SB.auth.signUp({email, password:A.pass}) : await SB.auth.signInWithPassword({email, password:A.pass});
    if (res.error) throw res.error;
    if (!res.data || !res.data.session){ A.busy = false; A.error = t('au_confirm'); render(); return; }
    Store.setSession(res.data.session); if (A.mode === 'signup') await Store.set('terms', {v:TERMS_V, at:new Date().toISOString()});
    resetUserState(); S.auth = null; S.loaded = false; render();
    await loadUserData();
  } catch(e){
    A.busy = false; const m = (e && e.message) || '';
    A.error = /already registered|already exists|user_already_exists/i.test(m) ? t('au_exists') : /invalid login|invalid credentials/i.test(m) ? t('au_wrong') : /password/i.test(m) ? t('au_bad_pass') : /email not confirmed/i.test(m) ? t('au_confirm') : t('err_generic');
    render();
  }
}
function viewForgot(){
  const A = S.auth;
  return '<div class="stack" style="padding-top:8px"><h1>' + esc(t('fp_t')) + '</h1><p class="muted">' + esc(t('fp_d')) + '</p>' +
    '<div class="card stack"><label class="field"><span>' + esc(t('au_email')) + '</span><input type="email" inputmode="email" autocomplete="email" autocapitalize="off" id="au-email" data-f="auth.email" value="' + esc(A.email) + '"></label>' +
    (A.sent ? note('info', esc(t('fp_sent'))) : '') + (A.error ? note('danger', esc(A.error)) : '') +
    '<button class="btn primary big block" data-act="fp-go"' + (A.busy ? ' disabled' : '') + '>' + esc(A.busy ? t('loading') : t('fp_go')) + '</button></div>' +
    '<button class="btn ghost block" data-act="auth-mode" data-v="login">' + esc(t('fp_back')) + '</button><p class="small muted">' + esc(t('fp_help')) + '</p>' + copyLine() + '</div>';
}
async function fpGo(){
  const A = S.auth; if (!A || A.busy) return; A.error = null; A.sent = false;
  const email = String(A.email || '').trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ A.error = t('au_bad_email'); render(); return; }
  A.busy = true; render();
  try {
    const res = await SB.auth.resetPasswordForEmail(email, {redirectTo:location.origin + location.pathname + '?reset=1'});
    if (res && res.error) throw res.error;
    A.busy = false; A.sent = true; render();
  } catch(e){
    A.busy = false; const m = (e && e.message) || '';
    A.error = (e && e.status === 429) || /rate limit|security purposes|seconds|too many/i.test(m) ? t('fp_wait') : t('err_generic');
    render();
  }
}
function viewRecover(){
  const R = S.recover;
  return '<div class="stack" style="padding-top:8px"><h1>' + esc(t('rp_t')) + '</h1><p class="muted">' + esc(t('rp_d', {e:Store.email || ''})) + '</p>' +
    '<div class="card stack"><label class="field"><span>' + esc(t('rp_new')) + '</span><input type="password" autocomplete="new-password" id="rp-pass" data-f="recover.pass" value="' + esc(R.pass) + '"></label>' +
    '<label class="field"><span>' + esc(t('rp_new2')) + '</span><input type="password" autocomplete="new-password" id="rp-pass2" data-f="recover.pass2" value="' + esc(R.pass2) + '"></label>' +
    '<p class="tiny muted">' + esc(t('au_pass_hint')) + '</p>' + (R.error ? note('danger', esc(R.error)) : '') +
    '<button class="btn primary big block" data-act="rp-go"' + (R.busy ? ' disabled' : '') + '>' + esc(R.busy ? t('loading') : t('rp_go')) + '</button></div>' + copyLine() + '</div>';
}
async function rpGo(){
  const R = S.recover; if (!R || R.busy) return; R.error = null;
  if (String(R.pass || '').length < 8){ R.error = t('au_bad_pass'); render(); return; }
  if (R.pass !== R.pass2){ R.error = t('rp_mismatch'); render(); return; }
  R.busy = true; render();
  try {
    const res = await SB.auth.updateUser({password:R.pass});
    if (res && res.error) throw res.error;
    S.recover = null; toast(t('rp_done')); S.loaded = false; render();
    await loadUserData();
  } catch(e){
    R.busy = false; const m = (e && e.message) || '';
    R.error = /different|same/i.test(m) ? t('rp_same') : /password/i.test(m) ? t('au_bad_pass') : /session|jwt|expired/i.test(m) ? t('fp_expired') : t('err_generic');
    render();
  }
}
async function logout(){ if (Store.demo){ location.reload(); return; } await remUnsubscribe(); if (S.profile && S.profile.reminders){ S.profile.reminders.on = false; await Store.set('profile', S.profile); } try { await SB.auth.signOut(); } catch(e){} onSignedOut(); }
async function loadUserData(){
  S.profile = await Store.get('profile');
  S.terms = Store.demo ? {v:TERMS_V} : await Store.get('terms');
  S.termsGate = !Store.demo && !(S.terms && S.terms.v >= TERMS_V);
  if (S.profile && S.profile.lang && T[S.profile.lang]) LANG = S.profile.lang;
  if (S.profile && S.profile.amb && AMBS[S.profile.amb]) setAmb(S.profile.amb);
  const ks = []; for (let i = 0; i < 14; i++) ks.push(addDays(dayKey(), -i));
  const res = await Promise.all([Store.get('favorites'), Store.get('body'), Store.get('bilans')].concat(ks.map(k => Store.get('day-' + k))));
  S.favorites = (res[0] && res[0].items) || []; S.body = res[1] || {entries:[]}; if (!S.body.entries) S.body.entries = []; S.bilans = res[2] || {weeks:{}};
  S.days = {}; ks.forEach((k, i) => { if (res[3 + i]) S.days[k] = res[3 + i]; });
  if (Store.demo){ S.sample = null; S.imgOk = false; } else { S.sample = makeAI(); S.imgOk = true; } S.sampleReady = true; S.downloads = DL;
  S.loaded = true; S.auth = null;

  if (!Store.demo){ if (q.get('billing')) payReturn(q); else accLoad().then(render); }
  if (sl && S.profile && S.profile.onboarded){ S.sheet = null; S.view = 'today'; S.flashSlot = sl; try { history.replaceState(null, '', location.pathname); } catch(e){} render(); }
  if (!Store.demo){ if (remPrefs().on) swReg(); remCheck(); vacSync(); }
}
const RECOV = (() => { try { const q = new URLSearchParams(location.search); const h = new URLSearchParams(String(location.hash || '').replace(/^#/, '')); return {on:q.get('reset') === '1' || h.get('type') === 'recovery', err:h.get('error_code') || h.get('error') || q.get('error_code') || ''}; } catch(e){ return {on:false, err:''}; } })();
async function boot(){
  const nl = (navigator.language || 'fr').slice(0, 2).toLowerCase(); LANG = T[nl] ? nl : 'fr';
  const sl = lsGet('ca_lang'); if (T[sl]) LANG = sl;
  try { const a = localStorage.getItem('ca_amb'); if (AMBS[a]) AMB = a; } catch(e){}
  applyAmb(); loadView(); applyView();
  render();
  await Store.init();
  if (Store.unconfigured){ S.loaded = true; S.cfgMissing = Store.unconfigured; render(); return; }
  if (RECOV.on){
    try { history.replaceState(null, '', location.pathname); } catch(e){}

    if (Store.uid && !RECOV.err){ S.recover = {pass:'', pass2:'', busy:false, error:null}; render(); return; }
    S.auth = newAuth(); S.auth.mode = 'forgot'; S.auth.error = t('fp_expired'); render(); return;

}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', () => { swReg(); });
